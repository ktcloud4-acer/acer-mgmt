# Traefik — 내부 단일 인그레스 / 리버스 프록시 (다른 서비스의 라우팅 라벨 패턴 레퍼런스)
# 기동:  make up s=edge/traefik

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      - ${DATA_ROOT:-/home/mgmt-data}/traefik/acme.json:/acme.json
    networks:
      - mgmt-proxy
    labels:
      - "traefik.enable=true"
      # ── 다른 서비스에 이 패턴을 복사해서 사용 ──
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=secure-headers@file"

networks:
  mgmt-proxy:
    external: true
