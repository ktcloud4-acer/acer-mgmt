# Traefik — 내부 단일 인그레스 (Cloudflare Tunnel 모드, 평문 HTTP)
# cloudflared 가 docker 네트워크로 traefik:80 에 접속 → Host 기반 라우팅.
# 다른 서비스는 아래 라벨 패턴을 복사해서 노출한다(entrypoints=web).
# 기동:  make up s=edge/traefik

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - "80:80"          # (선택) LAN/Tailscale 직접 접근용. 터널 경로는 호스트 포트 불필요.
    # 주의: Docker Engine 29.x(min API 1.40)는 traefik docker provider(API 1.24)를 거부한다.
    #       traefik 측 DOCKER_API_VERSION 은 무시되므로, 데몬측 DOCKER_MIN_API_VERSION=1.24
    #       drop-in 으로 해결한다. → docs/runbook.md "Docker 29.x 호환" 참조.
    environment:
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
    networks:
      - mgmt-proxy
    labels:
      - "traefik.enable=true"
      # ── 다른 서비스에 이 패턴 복사 (Host 규칙만 교체) ──
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=secure-headers@file"

networks:
  mgmt-proxy:
    external: true
