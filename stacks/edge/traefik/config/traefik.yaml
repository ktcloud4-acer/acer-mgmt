# Traefik static config — Cloudflare Tunnel 모드
# TLS는 Cloudflare 엣지에서 종단. cloudflared → traefik:80(평문 HTTP) → 서비스.
# 따라서 내부 ACME/HTTPS 리다이렉트는 두지 않는다.
api:
  dashboard: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    exposedByDefault: false        # traefik.enable=true 라벨이 있는 컨테이너만 노출
    network: mgmt-proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
accessLog: {}
