<!-- Shared agent configuration. Apply through the Wazuh manager only after
     reviewing the target host group; private data paths are excluded. -->
<agent_config>
  <syscheck>
    <directories check_all="yes">/etc,/usr/local/etc</directories>
    <directories check_all="yes">/opt</directories>
    <ignore>/home/mgmt-data/vault</ignore>
    <ignore>/home/mgmt-data/vault-agent/secrets</ignore>
    <ignore>/home/mgmt-data/vault-tls</ignore>
    <ignore>/etc/kolla/passwords.yml</ignore>
    <ignore>/etc/ssh/ssh_host_.*_key</ignore>
    <ignore>/root/.ssh</ignore>
    <ignore>/home/*/.ssh</ignore>
    <ignore>/home/*/.kube</ignore>
    <ignore type="sregex">\.tfstate(\.backup)?$</ignore>
    <ignore type="sregex">(^|/)(backup|backups|dump|dumps)(/|$)</ignore>
    <nodiff>/home/mgmt-data/vault</nodiff>
    <nodiff>/home/mgmt-data/vault-agent/secrets</nodiff>
  </syscheck>
</agent_config>
