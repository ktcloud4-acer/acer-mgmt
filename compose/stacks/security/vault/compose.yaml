# Vault Community — single-node Raft integrated storage
# 초기화 결과는 git 제외된 secrets/vault-init.json 에 저장한다.

services:
  vault-audit-socket:
    image: alpine/socat:1.8.1.3
    container_name: vault-audit-socket
    restart: unless-stopped
    command:
      - UNIX-LISTEN:/vault/audit-socket/vault.sock,fork,mode=0660
      - OPEN:/vault/audit-secondary/vault-audit-socket.log,creat,append,mode=0600
    user: "100:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/vault-audit-socket:/vault/audit-socket:z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-audit-secondary:/vault/audit-secondary:Z

  vault:
    image: hashicorp/vault:2.0.3
    container_name: vault
    restart: unless-stopped
    command: server
    environment:
      TZ: ${TZ:-Asia/Seoul}
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.crt
    depends_on:
      - vault-audit-socket
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
      memlock: -1
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/vault:/vault/data:Z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-audit:/vault/audit:Z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-audit-socket:/vault/audit-socket:z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-tls:/vault/tls:ro,z
    networks:
      - mgmt-proxy
    healthcheck:
      test:
        - CMD-SHELL
        - vault status >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.vault.rule=Host(`vault.${BASE_DOMAIN}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.middlewares=redirect-to-teleport-vault@file"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
      - "traefik.http.services.vault.loadbalancer.server.scheme=https"
      - "traefik.http.services.vault.loadbalancer.serversTransport=vault-tls@file"

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
