version: v3

teleport:
  nodename: acer-mgmt-teleport
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: true
  cluster_name: acer-mgmt
  listen_addr: 0.0.0.0:3025
  authentication:
    type: local
    second_factor: otp
    webauthn:
      rp_id: teleport.imcherry5778.xyz
  session_recording_config:
    mode: proxy-sync
  proxy_listener_mode: separate

proxy_service:
  enabled: true
  web_listen_addr: 0.0.0.0:3080
  public_addr: teleport.imcherry5778.xyz:3080
  listen_addr: 0.0.0.0:3023
  ssh_public_addr: teleport.imcherry5778.xyz:3023
  tunnel_listen_addr: 0.0.0.0:3024
  tunnel_public_addr: teleport.imcherry5778.xyz:3024
  kube_listen_addr: 0.0.0.0:3026
  kube_public_addr: teleport.imcherry5778.xyz:3026
  https_keypairs:
    - cert_file: /run/teleport/tls/tls.crt
      key_file: /run/teleport/tls/tls.key
  https_keypairs_reload_interval: 1h

ssh_service:
  enabled: false

kubernetes_service:
  enabled: false

db_service:
  enabled: false

discovery_service:
  enabled: false

app_service:
  enabled: true
  apps:
    - name: kibana
      uri: http://kibana:5601
      public_addr: kibana.teleport.imcherry5778.xyz
      rewrite:
        redirect: [kibana.imcherry5778.xyz]
      labels:
        env: mgmt
        owner: observability
    - name: prometheus
      uri: http://prometheus:9090
      public_addr: prometheus.teleport.imcherry5778.xyz
      rewrite:
        redirect: [prometheus.imcherry5778.xyz]
      labels:
        env: mgmt
        owner: observability
    - name: alertmanager
      uri: http://alertmanager:9093
      public_addr: alertmanager.teleport.imcherry5778.xyz
      rewrite:
        redirect: [alertmanager.imcherry5778.xyz]
      labels:
        env: mgmt
        owner: observability
    # Supplemental admin entry only. The direct keycloak.${BASE_DOMAIN}
    # hostname remains the canonical OIDC issuer for platform clients.
    - name: keycloak-admin
      description: Keycloak administration console through Teleport
      uri: http://keycloak:8080
      public_addr: keycloak-admin.teleport.imcherry5778.xyz
      rewrite:
        redirect: [keycloak.imcherry5778.xyz]
      labels:
        env: mgmt
        owner: security
    - name: vault
      uri: https://vault:8200
      public_addr: vault.teleport.imcherry5778.xyz
      rewrite:
        redirect: [vault.imcherry5778.xyz]
      insecure_skip_verify: true
      labels:
        env: mgmt
        owner: security
    - name: adguard
      uri: http://adguard:3000
      public_addr: adguard.teleport.imcherry5778.xyz
      rewrite:
        redirect: [adguard.imcherry5778.xyz]
        headers:
          - "Host: adguard.teleport.imcherry5778.xyz"
          - "Origin: https://adguard.teleport.imcherry5778.xyz:3080"
      labels:
        env: mgmt
        owner: infra
    - name: traefik
      description: Traefik ingress dashboard through Teleport
      uri: http://traefik:8081/dashboard/
      public_addr: traefik.teleport.imcherry5778.xyz
      rewrite:
        redirect: [traefik.imcherry5778.xyz]
        headers:
          - "Host: traefik.teleport.imcherry5778.xyz"
      labels:
        env: mgmt
        owner: platform
    - name: minio-console
