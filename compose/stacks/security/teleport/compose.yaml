# Teleport single-node access plane.
# The proxy binds to Tailscale only and owns its TLS endpoints directly.

services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.9.2
    container_name: teleport
    hostname: teleport
    restart: unless-stopped
    command:
      - teleport
      - start
      - --config=/etc/teleport/teleport.yaml
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3080:3080/tcp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3023:3023/tcp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3024:3024/tcp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3026:3026/tcp"
    volumes:
      - ./config/teleport.yaml:/etc/teleport/teleport.yaml:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/teleport:/var/lib/teleport:Z
      - /run/acer-mgmt/secrets/security/teleport:/run/teleport/tls:ro,z
    networks:
      - mgmt-proxy
    healthcheck:
      test: ["CMD", "tctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 45s

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
