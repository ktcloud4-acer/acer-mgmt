# Teleport single-node access plane.
# The proxy binds to Tailscale only and owns its TLS endpoints directly.

services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.9.2
    container_name: teleport
    hostname: teleport
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3080:3080/tcp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3023:3023/tcp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3024:3024/tcp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:3026:3026/tcp"
    volumes:
      - ./config/teleport.yaml:/etc/teleport/teleport.yaml:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/teleport:/var/lib/teleport:Z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-agent/secrets/security/teleport:/run/teleport/tls:ro,Z
    networks:
      mgmt-proxy: {}
      # Dedicated Grafana auth network: only Traefik, Grafana, this Teleport
      # service, and the header bridge can join it.
      traefik-grafana-auth:
        ipv4_address: ${TELEPORT_GRAFANA_AUTH_IP:-10.254.254.4}
      supabase_default: {}
    healthcheck:
      test: ["CMD", "tctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 45s

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
  traefik-grafana-auth:
    name: ${TRAEFIK_GRAFANA_AUTH_NET:-traefik-grafana-auth}
    external: true
  supabase_default:
    name: ${SUPABASE_NET:-supabase_default}
    external: true
