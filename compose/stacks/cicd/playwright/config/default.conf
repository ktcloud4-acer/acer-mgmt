# Playwright e2e 리포트 정적 서빙 + WebDAV PUT 업로드(CI가 리포트 갱신).
server {
    listen 80;
    server_name _;
    root /srv/report;

    # 브라우저 조회: / -> 대시보드, /e2e-report.html -> 최신 e2e 리포트
    location / {
        index index.html e2e-report.html;
        autoindex on;
    }

    # CI 업로드: PUT /e2e-report.html (tailnet 내부 전용)
    location = /e2e-report.html {
        root /srv/report;
        dav_methods PUT;
        create_full_put_path on;
        client_max_body_size 64m;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
