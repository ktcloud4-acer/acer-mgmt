# Semaphore UI + PostgreSQL

x-semaphore-vault-env: &semaphore-vault-env
  env_file:
    - ${SEMAPHORE_VAULT_ENV_FILE:-/home/mgmt-data/vault-agent/secrets/cicd/semaphore.env}

services:
  semaphore:
    <<: *semaphore-vault-env
    build:
      context: .
      dockerfile: Dockerfile
    image: acer/semaphore-k6-kubectl:v2.18.25-k6.1.0.0-rc2-kubectl.1.35.6
    container_name: semaphore
    # Vault Agent renders OIDC secrets as group 1000 with mode 0640.
    user: "1001:1000"
    restart: unless-stopped
    depends_on:
      semaphore-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: semaphore-db
      SEMAPHORE_DB_PORT: "5432"
      SEMAPHORE_DB: semaphore
      SEMAPHORE_DB_NAME: semaphore
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN_USER:-admin}
      SEMAPHORE_ADMIN_NAME: Administrator
      SEMAPHORE_ADMIN_EMAIL: admin@${BASE_DOMAIN}
      SEMAPHORE_SCHEDULE_TIMEZONE: ${TZ:-Asia/Seoul}
      SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore
      # Semaphore owns the user session through Keycloak OIDC. The client
      # secret stays in the mounted file, never in the container environment.
      SEMAPHORE_PASSWORD_LOGIN_DISABLED: "true"
      SEMAPHORE_OIDC_PROVIDERS: >-
        {"keycloak":{"display_name":"Keycloak","provider_url":"https://keycloak.${BASE_DOMAIN}/realms/${KEYCLOAK_REALM:-mgmt}","client_id":"${SEMAPHORE_OIDC_CLIENT_ID:-semaphore}","client_secret_file":"/run/secrets/semaphore_oidc_client_secret","redirect_url":"https://semaphore.${BASE_DOMAIN}/api/auth/oidc/keycloak/redirect","scopes":["openid","profile","email"],"username_claim":"preferred_username","email_claim":"email","name_claim":"name"}}
    volumes:
      - ${MGMT_REPO_ROOT:-/home/user1/acer-mgmt}:/opt/acer-mgmt:ro
      - ${DATA_ROOT:-/home/mgmt-data}/vault-agent/secrets/cicd/k6:/run/vault-k6:ro
      - ${DATA_ROOT:-/home/mgmt-data}/vault-agent/secrets/semaphore_oidc_client_secret:/run/secrets/semaphore_oidc_client_secret:ro,z
    networks:
      - default
      - mgmt-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.semaphore.rule=Host(`semaphore.${BASE_DOMAIN}`)"
      - "traefik.http.routers.semaphore.entrypoints=websecure"
      # oauth2-auth enforces platform-admin without converting Semaphore's own
      # API 401 responses into the oauth2-proxy sign-in loop.
      - "traefik.http.routers.semaphore.middlewares=oauth2-auth@file,semaphore-iframe@file"
      - "traefik.http.services.semaphore.loadbalancer.server.port=3000"

  semaphore-db:
    <<: *semaphore-vault-env
    image: postgres:17-alpine
    container_name: semaphore-db
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: semaphore
      POSTGRES_USER: semaphore
    volumes:
      - semaphore-postgres:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore -d semaphore"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  semaphore-postgres:
    name: semaphore-postgres

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
