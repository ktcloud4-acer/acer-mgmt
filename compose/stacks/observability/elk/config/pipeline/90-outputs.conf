output {
  if [labels][log_type] == "infra" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "infra-logs-%{[labels][user]}-%{+YYYY.MM.dd}"
    }
  }
  else if [labels][log_type] == "k8s" {
    # Filebeat 내장 모듈의 인제스트 파이프라인이 매핑되어 들어온 경우
    if [@metadata][pipeline] {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "k8s-logs-%{[labels][user]}-%{+YYYY.MM.dd}"
        pipeline => "%{[@metadata][pipeline]}"
      }
    }
    # 모듈이 없는 일반 사용자 정의 컨테이너 앱 로그일 경우 (에러 방어)
    else {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "k8s-logs-%{[labels][user]}-%{+YYYY.MM.dd}"
      }
    }
  }
  else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "service-logs-mgmt-%{+YYYY.MM.dd}"
    }
  }
}

