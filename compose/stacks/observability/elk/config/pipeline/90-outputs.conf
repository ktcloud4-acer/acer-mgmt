output {
  # [1] log_type이 'infra'인 로그 (호스트 OS 및 오픈스택)
  if [log_type] == "infra" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "infra-logs-%{user}-%{+YYYY.MM.dd}"
    }
  }
  # [2] mgmt 중앙 서버의 Docker Compose 컨테이너 로그
  # 이 로그들은 K8s가 아니므로 'service-logs-'로 분리하여 이름 혼선을 방지합니다.
  else if [source_type] == "docker" or [cluster] == "mgmt" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "service-logs-%{user}-%{+YYYY.MM.dd}"
    }
  }
  # [3] 추후 수집할 실제 원격 Kubernetes 클러스터의 컨테이너 로그
  else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "k8s-logs-%{user}-%{+YYYY.MM.dd}"
    }
  }
}
