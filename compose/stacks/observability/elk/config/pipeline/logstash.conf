input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # [분류 규칙 1] Filebeat의 중첩 필드(fields.user, fields.log_type)를 최상위(root) 필드로 단일화합니다.
  # 이렇게 하면 Filebeat의 설정 방식에 관계없이 Logstash와 Elasticsearch가 필드명을 일관되게 인식합니다.
  if [fields][user] {
    mutate {
      add_field => { "user" => "%{[fields][user]}" }
    }
  }
  if [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }

  # [분류 규칙 2] 예외 에러 방지를 위해 user 필드가 완전히 누락된 경우 기본값 'system'을 부여합니다.
  if ![user] {
    mutate {
      add_field => { "user" => "system" }
    }
  }

  # [분류 규칙 3] 수집된 로그 본문(message)이 JSON 포맷({ 로 시작)이면 key-value 컬럼으로 자동 분해합니다.
  # (예: FastAPI의 {"level": "ERROR"} -> DB 상의 별개 검색 필드로 분해)
  if [message] =~ /^\{.*/ {
    json {
      source => "message"
    }
  }

  # [분류 규칙 4] 로그 본문 내 장애 유발 핵심 키워드 감지 시 'error_detected' 태그를 자동 주입합니다.
  if [message] =~ /(?i)error|fail|critical|exception|oom-killer/ {
    mutate {
      add_tag => ["error_detected"]
    }
  }
}

output {
  # [분류 규칙 5] log_type이 'infra'인 로그(호스트 OS, OpenStack)는 infra 전용 인덱스로 전송합니다.
  if [log_type] == "infra" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "infra-logs-%{user}-%{+YYYY.MM.dd}"
    }
  }
  # 그 외 K8s 컨테이너 및 애플리케이션 로그는 k8s 전용 인덱스로 전송합니다.
  else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "k8s-logs-%{user}-%{+YYYY.MM.dd}"
    }
  }
}
