# ─────────────────────────────────────────────────────────────────────────────
# 50-audit-alerts.conf — 고신호 보안 감사 이벤트 탐지(무상태 단일 이벤트)
#
# 20-filters(정규화) 직후, Kafka 전에 [labels][audit_alert] + [event][severity] 를
# 스탬프한다. consumer(90-outputs)는 이 스탬프를 보고 acer-audit-alerts-* 인덱스에
# 추가 색인한다(원본 acer-audit-* 색인과 병행).
#
# 여기 규칙은 "단일 이벤트로 판정 가능한" 고신호만 다룬다. 인증실패 급증 같은
# 비율 기반(rate) 탐지는 상태가 필요하므로 후속(throttle/metrics 필터 또는 SIEM)에서.
# ─────────────────────────────────────────────────────────────────────────────
filter {
  # Vault: root 정책 토큰 사용 = 최상위 특권. 정상 운영에선 거의 나오면 안 됨.
  if [labels][audit_source] == "vault" {
    if "root" in [app][auth][policies] {
      mutate {
        add_field => {
          "[labels][audit_alert]" => "vault-root-token-used"
          "[event][severity]"     => "critical"
        }
      }
    }
    # Vault 감사/가용성에 영향을 주는 민감 sys 연산(감사장치 변경·봉인·리키 등).
    if [app][request][path] =~ /^sys\/(audit|seal|unseal|step-down|rotate|rekey)/ {
      mutate {
        add_field => {
          "[labels][audit_alert]" => "vault-sensitive-sysop"
          "[event][severity]"     => "critical"
        }
      }
    }
  }

  # Wazuh: 규칙 레벨 12+ = 고위험(호스트 침입/무결성). alert-only 로 이미 유입됨.
  if [labels][audit_source] == "wazuh" and [app][rule][level] {
    if [app][rule][level] >= 12 {
      mutate {
        add_field => {
          "[labels][audit_alert]" => "wazuh-high-severity"
          "[event][severity]"     => "high"
        }
      }
    }
  }
}
