filter {
  # [분류 규칙 1] Filebeat의 중첩 필드(fields.user, fields.log_type)를 최상위(root) 필드로 단일화합니다.
  if [fields][user] {
    mutate {
      add_field => { "user" => "%{[fields][user]}" }
    }
  }
  if [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }

  # [분류 규칙 2] 예외 에러 방지를 위해 user 필드가 완전히 누락된 경우 기본값 'system'을 부여합니다.
  if ![user] {
    mutate {
      add_field => { "user" => "system" }
    }
  }

  # [분류 규칙 3] 수집된 로그 본문(message)이 JSON 포맷({ 로 시작)이면 key-value 컬럼으로 자동 분해합니다.
  if [message] =~ /^\{.*/ {
    json {
      source => "message"
    }
  }

  # [분류 규칙 4] 로그 본문 내 장애 유발 핵심 키워드 감지 시 'error_detected' 태그를 자동 주입합니다.
  if [message] =~ /(?i)error|fail|critical|exception|oom-killer/ {
    mutate {
      add_tag => ["error_detected"]
    }
  }

  # 기존 기본값 보정 필터들
  if ![level] {
    mutate {
      add_field => { "level" => "INFO" }
    }
  }

  mutate {
    uppercase => ["level"]
  }

  if ![cluster] {
    mutate {
      add_field => { "cluster" => "unknown" }
    }
  }

  if ![environment] {
    mutate {
      add_field => { "environment" => "unknown" }
    }
  }

  if ![source_type] {
    mutate {
      add_field => { "source_type" => "unknown" }
    }
  }

  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}
