filter {
  # [1] Fields normalization (Filebeat 중첩 필드 단일화)
  if [fields][user] {
    mutate {
      add_field => { "user" => "%{[fields][user]}" }
    }
  }
  if [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }
  if ![user] {
    mutate {
      add_field => { "user" => "mgmt" }
    }
  }

  # [2] JSON 자동 파싱 (FastAPI, Nginx 등 구조화 로그)
  if [message] =~ /^\{.*/ {
    json {
      source => "message"
    }
  }

  # [3] K8s 메타데이터 최상위 필드로 승격 (Kibana 검색 및 인덱스 가속화)
  if [kubernetes] {
    mutate {
      add_field => {
        "k8s_namespace" => "%{[kubernetes][namespace_name]}"
        "k8s_pod" => "%{[kubernetes][pod_name]}"
        "k8s_container" => "%{[kubernetes][container_name]}"
        "k8s_node" => "%{[kubernetes][node_name]}"
      }
    }
  }

  # [4] 다양한 로그 레벨 필드 표준화 (level, severity, log.level -> log_level로 통합)
  if [level] {
    mutate { add_field => { "log_level" => "%{level}" } }
  } else if [log_level] {
    mutate { add_field => { "log_level" => "%{log_level}" } }
  } else if [severity] {
    mutate { add_field => { "log_level" => "%{severity}" } }
  } else if [log][level] {
    mutate { add_field => { "log_level" => "%{[log][level]}" } }
  }

  if ![log_level] {
    mutate { add_field => { "log_level" => "INFO" } }
  }

  mutate {
    uppercase => ["log_level"]
  }

  # [5] 애플리케이션 내부 타임스탬프 동기화
  # (수집 시간이 아닌, 실제 앱이 에러를 기록한 소스 시간으로 덮어씀)
  if [time] {
    date {
      match => ["time", "ISO8601", "yyyy-MM-dd HH:mm:ss", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
  } else if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
  }

  # [6] 장애 키워드 및 에러 레벨 실시간 자동 감지 및 태깅
  if [message] =~ /(?i)error|fail|critical|exception|oom-killer/ or [log_level] == "ERROR" or [log_level] == "FATAL" {
    mutate {
      add_tag => ["error_detected"]
    }
  }

  # 기본 백업 필드 보정
  if ![cluster] {
    mutate { add_field => { "cluster" => "unknown" } }
  }
  if ![environment] {
    mutate { add_field => { "environment" => "unknown" } }
  }
  if ![source_type] {
    mutate { add_field => { "source_type" => "unknown" } }
  }
}
