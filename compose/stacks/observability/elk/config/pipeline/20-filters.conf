filter {
  # [0] log 필드 타입 충돌 방어 (log가 문자열인 경우 객체로 강제 리매핑하여 _mutate_error 방지)
  if [log] {
    if ![log][file] and ![log][offset] and ![log][level] {
      mutate {
        add_field => { "[log_message_raw]" => "%{log}" }
        remove_field => [ "log" ]
      }
    }
  }

  # [1] 사용자(Tenant) 및 메타데이터 필드 정제
  if [labels][team] {
    mutate { replace => { "[labels][user]" => "%{[labels][team]}" } }
  } else if [fields][team] {
    mutate {
      replace => {
        "[labels][team]" => "%{[fields][team]}"
        "[labels][user]" => "%{[fields][team]}"
      }
    }
  } else if [fields][user] {
    mutate {
      replace => {
        "[labels][team]" => "%{[fields][user]}"
        "[labels][user]" => "%{[fields][user]}"
      }
    }
  } else if [user] {
    mutate {
      replace => {
        "[labels][team]" => "%{[user]}"
        "[labels][user]" => "%{[user]}"
      }
    }
  } else if [host][name] == "acer-mgmt" {
    mutate {
      replace => {
        "[labels][team]" => "mgmt"
        "[labels][user]" => "mgmt"
      }
    }
  } else if ![labels][team] {
    mutate {
      replace => {
        "[labels][team]" => "unknown"
        "[labels][user]" => "unknown"
      }
    }
  }

  if [labels][team] == "mgmt" and (
    [container][name] =~ /^k3d-/ or
    [container][image][name] =~ /^rancher\/k3s:/ or
    [container][labels][app] == "k3d" or
    [container][labels][k3d_cluster]
  ) {
    mutate {
      replace => {
        "[labels][log_type]" => "k3d"
        "[log_type]" => "k3d"
      }
    }
  }
  
  if ![labels][log_type] {
    if [fields][log_type] {
      mutate { replace => { "[labels][log_type]" => "%{[fields][log_type]}" } }
    } else if [log_type] {
      mutate { replace => { "[labels][log_type]" => "%{[log_type]}" } }
    } else if [event][dataset] =~ /^system\./ or [event][module] == "system" or [fileset][module] == "system" or [@metadata][pipeline] =~ /system-/ {
      mutate { replace => { "[labels][log_type]" => "system" } }
    } else if [kubernetes] {
      mutate { replace => { "[labels][log_type]" => "kubernetes" } }
    } else if [container] or [docker] {
      mutate { replace => { "[labels][log_type]" => "docker" } }
    } else {
      mutate { replace => { "[labels][log_type]" => "service" } }
    }
  }

  if ![labels][platform] {
    if [kubernetes] {
      mutate { replace => { "[labels][platform]" => "k8s" } }
    } else if [host][name] == "acer-aio" {
      mutate { replace => { "[labels][platform]" => "aio" } }
    } else if [host][name] == "acer-mgmt" {
      mutate { replace => { "[labels][platform]" => "mgmt" } }
    }
  }

  # Harbor는 Docker syslog 드라이버가 /home/mgmt-data/harbor/log/*.log로
  # 기록하므로 파일명에서 component를 복원한다.
  if [labels][log_track] == "harbor" and [log][file][path] {
    grok {
      match => {
        "[log][file][path]" => "(?<harbor_component>[^/]+)\.log$"
      }
      tag_on_failure => ["_harbor_component_parse_failure"]
    }
    if [harbor_component] {
      mutate {
        add_field => {
          "[labels][harbor_component]" => "%{[harbor_component]}"
          "[container][name]" => "%{[harbor_component]}"
        }
        remove_field => [ "harbor_component" ]
      }
    }
  }

  # Kafka JSON 직렬화는 @metadata를 보존하지 않는다.
  # Elasticsearch consumer 단계에서 필요한 값은 일반 필드로 승격한다.
  if [@metadata][pipeline] and ![event][ingest_pipeline] {
    mutate { add_field => { "[event][ingest_pipeline]" => "%{[@metadata][pipeline]}" } }
  }

  # 64-byte 보조 입력과 기본 Docker 입력이 같은 줄을 읽더라도
  # 동일한 document_id를 사용해 Elasticsearch에서 한 건으로 수렴한다.
  if [labels][log_type] == "docker" and [container][id] and [message] {
    fingerprint {
      source => [
        "[host][name]",
        "[container][id]",
        "[@timestamp]",
        "[message]"
      ]
      concatenate_sources => true
      method => "SHA256"
      target => "[event][hash]"
    }
  }


  # [2] JSON 자동 파싱 (충돌 및 필드 오염 방지 설계)
  if [message] =~ /\{\s*"/ {
    # 1단계: 접두어에 구애받지 않도록 JSON 데이터 부분만 정밀 추출
    grok {
      match => { "message" => '(?<json_payload>\{\s*".*\})' }
      tag_on_failure => ["_grokjsonfailure"]
    }
    
    # 2단계: 최상위 필드 덮어쓰기 방지를 위해 안전한 임시 객체(target => "app")에 파싱
    if [json_payload] {
      json {
        source => "json_payload"
        target => "app"
        tag_on_failure => ["_jsonparsefailure"]
        remove_field => [ "json_payload" ]
      }
      
      # 3단계: 파싱에 성공하면, ECS 표준 필드와 겹치지 않는 커스텀 영역으로 안전 승격
      if [app] {
        # 로그 레벨 승격 및 매핑
        if [app][level] {
          mutate { replace => { "[log][level]" => "%{[app][level]}" } }
        }
        # 타임스탬프 동기화 (KST 타임존 중복 보정 방지 적용)
        if [app][time] {
          date {
            match => ["[app][time]", "ISO8601"]
            target => "@timestamp"
            # ISO8601에 타임존 오프셋이 있는 경우 timezone 설정을 생략해 시스템이 자동 계산하게 함
          }
        }
      }
    }
  }

  # [3] K8s 메타데이터 최상위 승격 (ECS 표준 kubernetes.* 유지 및 labels 보정)
  # K8s 수집 시 Filebeat가 붙여준 kubernetes 계층 구조를 보존하되 검색 편의를 위해 labels에 별도 수집
  if [kubernetes] {
    if [kubernetes][namespace] {
      mutate { add_field => { "[labels][k8s_namespace]" => "%{[kubernetes][namespace]}" } }
    }
    if [kubernetes][pod][name] {
      mutate { add_field => { "[labels][k8s_pod]" => "%{[kubernetes][pod][name]}" } }
      mutate { add_field => { "[labels][k8s_container]" => "%{[kubernetes][container][name]}" } }
      mutate { add_field => { "[labels][k8s_node]" => "%{[kubernetes][node][name]}" } }
    }
  }

  if [labels][log_type] == "k3d" {
    if [container][labels][k3d_cluster] {
      mutate { replace => { "[labels][k3d_cluster]" => "%{[container][labels][k3d_cluster]}" } }
    }
    if [container][labels][k3d_role] {
      mutate { replace => { "[labels][k3d_role]" => "%{[container][labels][k3d_role]}" } }
    }
    if [container][labels][k3d_version] {
      mutate { replace => { "[labels][k3d_version]" => "%{[container][labels][k3d_version]}" } }
    }
    grok {
      match => { "message" => 'time="%{TIMESTAMP_ISO8601:k3d_timestamp}" level=%{WORD:k3d_level} msg="%{GREEDYDATA:k3d_message}"' }
      tag_on_failure => ["_k3d_grok_fail"]
    }
    if [k3d_level] {
      mutate { replace => { "[log][level]" => "%{[k3d_level]}" } }
    }
    if [k3d_timestamp] {
      date {
        match => ["k3d_timestamp", "ISO8601"]
        target => "@timestamp"
      }
    }
  }

  if [labels][log_track] == "teleport" {
    mutate {
      replace => {
        "[labels][service]" => "teleport"
        "[labels][audit_source]" => "teleport"
        "[event][module]" => "teleport"
      }
    }
    if [app][event] {
      mutate { replace => { "[event][action]" => "%{[app][event]}" } }
    }
    if [app][code] {
      mutate { replace => { "[event][code]" => "%{[app][code]}" } }
    }
    if [app][user] {
      mutate { replace => { "[user][name]" => "%{[app][user]}" } }
    }
    if [app][login] {
      mutate { replace => { "[user][name]" => "%{[app][login]}" } }
    }
    if [app][time] {
      date {
        match => ["[app][time]", "ISO8601"]
        target => "@timestamp"
      }
    }
  }

  # The generic Docker harvester remains the single collector for container
  # stdout. Mark only identity/proxy access events as canonical audit records.
  if [container][name] =~ /^\/?(keycloak|oauth2-proxy|traefik)$/ {
    mutate {
      replace => {
        "[labels][audit_source]" => "%{[container][name]}"
        "[labels][service]" => "%{[container][name]}"
        "[event][module]" => "%{[container][name]}"
      }
    }
    mutate { gsub => [ "[labels][audit_source]", "^/", "", "[labels][service]", "^/", "", "[event][module]", "^/", "" ] }
  }

  # Never retain Vault request/response payloads or credentials in the shared
  # search cluster. Request ID, operation, path and identity are enough for
  # audit correlation and are normalized below.
  if [labels][audit_source] == "vault" and [app] {
    if [app][request][id] and [app][type] {
      fingerprint {
        source => [ "[app][request][id]", "[app][type]" ]
        concatenate_sources => true
        method => "SHA256"
        target => "[event][hash]"
      }
    }
    if [app][type] {
      mutate { replace => { "[event][action]" => "%{[app][type]}" } }
    }
    if [app][request][operation] {
      mutate { replace => { "[event][action]" => "%{[app][request][operation]}" } }
    }
    if [app][request][path] {
      mutate { replace => { "[url][path]" => "%{[app][request][path]}" } }
    }
    if [app][auth][display_name] {
      mutate { replace => { "[user][name]" => "%{[app][auth][display_name]}" } }
    }
    mutate {
      remove_field => [
        "[app][request][data]",
        "[app][response][data]",
        "[app][auth][client_token]",
        "[app][auth][token_type]"
      ]
    }
  }

  if [labels][audit_source] == "wazuh" and [app] {
    if [app][rule][id] {
      mutate { replace => { "[event][code]" => "%{[app][rule][id]}" } }
    }
    if [app][rule][description] {
      mutate { replace => { "[event][action]" => "%{[app][rule][description]}" } }
    }
    if [app][agent][name] {
      mutate { replace => { "[host][name]" => "%{[app][agent][name]}" } }
    }
    if [app][timestamp] {
      date { match => [ "[app][timestamp]", "ISO8601" ] target => "@timestamp" }
    }
  }

  if [labels][audit_source] {
    mutate {
      replace => {
        "[labels][log_type]" => "audit"
        "[event][kind]" => "event"
      }
    }
  }

  # Kubernetes/k3s klog lines often encode severity as the first letter
  # (I/W/E/F + MMDD), while container metadata still leaves log.level empty.
  # Normalize that prefix before the default INFO fallback below.
  if [message] =~ "^[IWEF][0-9]{4} " {
    grok {
      match => { "message" => "^(?<klog_level_letter>[IWEF])[0-9]{4} " }
      tag_on_failure => []
    }
    if [klog_level_letter] == "W" {
      mutate { replace => { "[log][level]" => "WARN" } }
    } else if [klog_level_letter] == "E" {
      mutate { replace => { "[log][level]" => "ERROR" } }
    } else if [klog_level_letter] == "F" {
      mutate { replace => { "[log][level]" => "FATAL" } }
    } else if [klog_level_letter] == "I" {
      mutate { replace => { "[log][level]" => "INFO" } }
    }
    mutate { remove_field => [ "klog_level_letter" ] }
  }

  # [4] 인프라 로그 파싱 (log_type == "infra" 대상 Grok 적용)
  # Syslog 표준(RFC3164) 형태의 로그 및 OpenStack Kolla 로그 파싱
  if [labels][log_type] in ["infra", "openstack"] {
    grok {
      match => { 
        "message" => [
          # RFC3164 Syslog 양식 파싱 (Dec 29 15:34:23 host process[123]: message)
          "^<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:process_name}(?:\[%{POSINT:process_pid}\])?: %{GREEDYDATA:log_message}",
          # OpenStack 표준 파이썬 로그 양식 파싱
          "^%{TIMESTAMP_ISO8601:log_timestamp} %{NUMBER:process_pid} %{LOGLEVEL:syslog_level} %{NOTSPACE:logger_name} %{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_infra_grok_fail"]
    }
    
    # 파싱된 데이터가 있을 경우 ECS 표준으로 맵핑
    if [syslog_level] {
      mutate { replace => { "[log][level]" => "%{syslog_level}" } }
    }
  }

  # [5] 로그 레벨 표준 수렴 (log.level 최적화)
  if [level] {
    mutate { replace => { "[log][level]" => "%{level}" } }
  } else if [log][level] {
    # 이미 잘 파싱되어 있으면 유지
  } else {
    mutate { replace => { "[log][level]" => "INFO" } }
  }
  mutate { uppercase => ["[log][level]"] }

  # Canonical log.level set for dashboards and alerts:
  # TRACE, DEBUG, INFO, NOTICE, WARN, ERROR, FATAL, CRITICAL.
  # Keep severity semantics from the source, but collapse common aliases.
  if [log][level] in ["WARNING", "WARNNING"] {
    mutate { replace => { "[log][level]" => "WARN" } }
  } else if [log][level] in ["ERR", "ERRO", "SEVERE"] {
    mutate { replace => { "[log][level]" => "ERROR" } }
  } else if [log][level] in ["CRIT"] {
    mutate { replace => { "[log][level]" => "CRITICAL" } }
  } else if [log][level] in ["INF", "INFORMATION", "INFORMATIONAL"] {
    mutate { replace => { "[log][level]" => "INFO" } }
  } else if [log][level] in ["DBG"] {
    mutate { replace => { "[log][level]" => "DEBUG" } }
  }

  # [6] 에러 태깅 오탐 최소화 규칙 (로그 레벨 기반 판별)
  # 텍스트 내 단순 "error" 단어가 아닌, 명시된 로그 레벨이 ERROR/FATAL/CRITICAL 일 때만 태깅
  if [log][level] in ["ERROR", "FATAL", "CRITICAL"] {
    if "error_detected" not in [tags] {
      mutate { add_tag => ["error_detected"] }
    }
  }
}
