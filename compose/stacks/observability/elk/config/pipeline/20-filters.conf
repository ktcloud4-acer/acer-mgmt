filter {
  # [1] Fields normalization (중첩 필드 최상위 단일화)
  if [fields][user] {
    mutate { add_field => { "user" => "%{[fields][user]}" } }
  }
  if [fields][log_type] {
    mutate { add_field => { "log_type" => "%{[fields][log_type]}" } }
  }
  if ![user] {
    mutate { add_field => { "user" => "mgmt" } }
  }

  # [2] JSON 자동 파싱
  if [message] =~ /^\{.*/ {
    json { 
      source => "message"
      tag_on_failure => ["_jsonparsefailure"] # 파싱 실패 시 이벤트 유실 방지
    }
  }

  # [3] K8s 메타데이터 최상위 필드로 안전하게 승격 (하위 필드 검증 추가)
  if [kubernetes] {
    if [kubernetes][namespace_name] {
      mutate { add_field => { "k8s_namespace" => "%{[kubernetes][namespace_name]}" } }
    }
    if [kubernetes][pod_name] {
      mutate { add_field => { "k8s_pod" => "%{[kubernetes][pod_name]}" } }
    }
    if [kubernetes][container_name] {
      mutate { add_field => { "k8s_container" => "%{[kubernetes][container_name]}" } }
    }
    if [kubernetes][node_name] {
      mutate { add_field => { "k8s_node" => "%{[kubernetes][node_name]}" } }
    }
  }

  # [4] 다양한 로그 레벨 필드 표준화 (무한배열화 버그 교정)
  # [log_level] 자가 바인딩 구문은 삭제하고, level / severity / [log][level]만 수렴시킵니다.
  if [level] {
    mutate { add_field => { "log_level" => "%{level}" } }
  } else if [severity] {
    mutate { add_field => { "log_level" => "%{severity}" } }
  } else if [log][level] {
    mutate { add_field => { "log_level" => "%{[log][level]}" } }
  }

  # log_level 필드가 끝까지 아예 없다면 기본값 INFO 설정
  if ![log_level] {
    mutate { add_field => { "log_level" => "INFO" } }
  }

  mutate { uppercase => ["log_level"] }

  # [5] 애플리케이션 내부 타임스탬프 동기화 (KST 9시간 시차 버그 완벽 해결)
  if [time] {
    date {
      match => ["time", "ISO8601", "yyyy-MM-dd HH:mm:ss", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      timezone => "Asia/Seoul" # 한국 시간(KST) 보정 강제 적용
    }
  } else if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      timezone => "Asia/Seoul" # 한국 시간(KST) 보정 강제 적용
    }
  }

  # [6] 장애 키워드 및 에러 레벨 실시간 자동 감지 및 태깅 (중복 태그 유입 방지)
  if [log_level] == "ERROR" or [log_level] == "FATAL" or [message] =~ /(?i)error|fail|critical|exception|oom-killer/ {
    if "error_detected" not in [tags] {
      mutate { add_tag => ["error_detected"] }
    }
  }

  # 기본 백업 필드 보정
  if ![cluster] { mutate { add_field => { "cluster" => "unknown" } } }
  if ![environment] { mutate { add_field => { "environment" => "unknown" } } }
  if ![source_type] { mutate { add_field => { "source_type" => "unknown" } } }
}
