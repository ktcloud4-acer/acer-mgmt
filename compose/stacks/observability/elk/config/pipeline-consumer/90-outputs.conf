output {
  # W0 탐지: 고신호 알림 이벤트(50-audit-alerts.conf 스탬프)는 전용 인덱스에도 색인한다.
  # acer-audit-* 패턴에 매칭되어 replica0 + 감사 보존 ILM 을 그대로 상속. 원본 감사
  # 인덱스 색인과 병행(additive)이라 아래 audit_source 체인과 독립적으로 실행된다.
  if [labels][audit_alert] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      index => "acer-audit-alerts-%{[labels][team]}-%{+YYYY.MM.dd}"
    }
  }
  if [labels][audit_source] {
    if [event][hash] {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "acer-audit-%{[labels][team]}-%{+YYYY.MM.dd}"
        document_id => "%{[event][hash]}"
      }
    } else {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "acer-audit-%{[labels][team]}-%{+YYYY.MM.dd}"
      }
    }
  }
  else if [labels][log_type] == "system" {
    if [event][ingest_pipeline] {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "logs-system-%{[labels][team]}-%{+YYYY.MM.dd}"
        pipeline => "%{[event][ingest_pipeline]}"
      }
    }
    else {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "logs-system-%{[labels][team]}-%{+YYYY.MM.dd}"
      }
    }
  }
  else if [labels][log_type] == "docker" {
    if [event][hash] {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "logs-docker-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
        document_id => "%{[event][hash]}"
      }
    }
    else {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "logs-docker-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
      }
    }
  }
  else if [labels][log_type] == "k3d" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      index => "logs-k3d-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
    }
  }
  else if [labels][log_type] in ["infra", "openstack"] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      index => "logs-openstack-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
    }
  }
  else if [labels][log_type] in ["k8s", "kubernetes"] {
    if [event][ingest_pipeline] {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "logs-kubernetes-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
        pipeline => "%{[event][ingest_pipeline]}"
      }
    }
    else {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        index => "logs-kubernetes-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
      }
    }
  }
  else if [labels][log_type] == "access" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      index => "logs-access-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
    }
  }
  else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      index => "logs-service-%{[labels][team]}-v2-%{+YYYY.MM.dd}"
    }
  }
}
