# Elasticsearch + Logstash + Kafka buffer + Kibana 단일 노드
# Kibana는 Traefik HTTPS, 수집 포트는 Tailscale 주소에만 노출한다.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: elasticsearch
    restart: unless-stopped
    mem_limit: 4g
    environment:
      discovery.type: single-node
      # W0: 감사 저장소 무결성 — 인증/인가 활성. elastic 초기 패스워드는 최초 부트스트랩
      # 시에만 사용되고 이후 무시된다(값은 Vault 렌더 env). enrollment 는 수동 부트스트랩
      # 절차를 쓰므로 계속 비활성.
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      ELASTIC_PASSWORD: ${ELK_ELASTIC_PASSWORD:?ELK_ELASTIC_PASSWORD must be set}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/elk/elasticsearch:/usr/share/elasticsearch/data:Z
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - default
    healthcheck:
      # 보안 활성 시 상태조회도 인증 필요. $$ 로 이스케이프해야 compose 가 리터럴
      # $ELASTIC_PASSWORD 를 넘기고, 컨테이너 셸이 런타임에 env 로 확장한다($ 하나면
      # compose 가 parse 타임에 빈 값으로 보간 → healthcheck 401 로 고장).
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 1m

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.3
    container_name: kibana
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # W0: 보안 활성 시 Kibana 는 kibana_system 서비스계정으로 ES 에 접속한다.
      # 사람 접근은 앞단 oauth2-proxy(sso-auth@file)로 게이트하고, Kibana 자체는
      # 네이티브 로그인을 쓴다(관리자=elastic break-glass). 패스워드/암호화키는 Vault.
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ELK_KIBANA_PASSWORD:?ELK_KIBANA_PASSWORD must be set}
      XPACK_SECURITY_ENCRYPTIONKEY: ${ELK_KIBANA_ENCRYPTION_KEY:?ELK_KIBANA_ENCRYPTION_KEY must be set (32+ chars)}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${ELK_KIBANA_SO_ENCRYPTION_KEY:?ELK_KIBANA_SO_ENCRYPTION_KEY must be set (32+ chars)}
      SERVER_PUBLICBASEURL: https://kibana.${BASE_DOMAIN}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - default
      - mgmt-proxy
    healthcheck:
      # 보안 활성 시 /api/status 가 인증을 요구할 수 있으므로 "응답 여부"로 판정한다
      # (200 정상 / 401·302 = 살아있으나 인증 요구). 서버 미기동이면 000 → unhealthy.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '200|302|401'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 1m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.kibana.rule=Host(`kibana.${BASE_DOMAIN}`)"
      - "traefik.http.routers.kibana.entrypoints=websecure"
      - "traefik.http.routers.kibana.middlewares=sso-auth@file,secure-headers@file"
      - "traefik.http.services.kibana.loadbalancer.server.port=5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.3
    container_name: logstash
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      LS_JAVA_OPTS: -Xms1g -Xmx1g
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      LOGS_KAFKA_TOPIC: ${LOGS_KAFKA_TOPIC:-logs.buffered}
    volumes:
      - ./config/pipeline:/usr/share/logstash/pipeline:ro,Z
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/elk/logstash:/usr/share/logstash/data:Z
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:5044:5044"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:5000:5000"
    networks:
      - default
      - mgmt-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 1m

  logstash-consumer:
    image: docker.elastic.co/logstash/logstash:9.4.3
    container_name: logstash-consumer
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: -Xms1g -Xmx1g
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      LOGS_KAFKA_TOPIC: ${LOGS_KAFKA_TOPIC:-logs.buffered}
      # W0: ES 보안 활성 → 최소권한 쓰기 계정으로 색인. 이 계정은 delete_index 권한이
      # 없어 침해된 인그레스가 감사 이력을 지울 수 없다(부트스트랩에서 role 생성).
      ES_USER: ${ELK_LOGSTASH_USER:-logstash_ingest}
      ES_PASSWORD: ${ELK_LOGSTASH_PASSWORD:?ELK_LOGSTASH_PASSWORD must be set}
    volumes:
      - ./config/pipeline-consumer:/usr/share/logstash/pipeline:ro,Z
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/elk/logstash-consumer:/usr/share/logstash/data:Z
    networks:
      - default
      - mgmt-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 1m

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
  mgmt-data:
    name: ${KAFKA_NET:-mgmt-data}
    external: true
