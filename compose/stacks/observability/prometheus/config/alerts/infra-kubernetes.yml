groups:
  - name: infra-kubernetes
    interval: 1m
    rules:
      - alert: ClusterMetricsMissing
        expr: absent_over_time(up{cluster="ggg"}[30m])
        for: 2h
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: prometheus-agent
          scope: cluster
          cluster: ggg
        annotations:
          title: "[cluster] 클러스터 메트릭 수신 중단"
          summary: "ggg 클러스터의 Prometheus remote_write 메트릭이 30분 이상 수신되지 않았습니다."
          description: "클러스터 전체 관측 데이터가 mgmt Prometheus로 들어오지 않습니다. ggg prometheus-agent, 네트워크, remote_write 설정을 확인하세요."

      - alert: ClusterMetricsMissing
        expr: absent_over_time(up{cluster="khb"}[30m])
        for: 2h
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: prometheus-agent
          scope: cluster
          cluster: khb
        annotations:
          title: "[cluster] 클러스터 메트릭 수신 중단"
          summary: "khb 클러스터의 Prometheus remote_write 메트릭이 30분 이상 수신되지 않았습니다."
          description: "클러스터 전체 관측 데이터가 mgmt Prometheus로 들어오지 않습니다. khb prometheus-agent, 네트워크, remote_write 설정을 확인하세요."

      - alert: ClusterMetricsMissing
        expr: absent_over_time(up{cluster="ljw"}[30m])
        for: 2h
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: prometheus-agent
          scope: cluster
          cluster: ljw
        annotations:
          title: "[cluster] 클러스터 메트릭 수신 중단"
          summary: "ljw 클러스터의 Prometheus remote_write 메트릭이 30분 이상 수신되지 않았습니다."
          description: "클러스터 전체 관측 데이터가 mgmt Prometheus로 들어오지 않습니다. ljw prometheus-agent, 네트워크, remote_write 설정을 확인하세요."

      - alert: ClusterMetricsMissing
        expr: absent_over_time(up{cluster="nmg"}[30m])
        for: 2h
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: prometheus-agent
          scope: cluster
          cluster: nmg
        annotations:
          title: "[cluster] 클러스터 메트릭 수신 중단"
          summary: "nmg 클러스터의 Prometheus remote_write 메트릭이 30분 이상 수신되지 않았습니다."
          description: "클러스터 전체 관측 데이터가 mgmt Prometheus로 들어오지 않습니다. nmg prometheus-agent, 네트워크, remote_write 설정을 확인하세요."

      - alert: ClusterMetricsMissing
        expr: absent_over_time(up{cluster="oje"}[30m])
        for: 2h
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: prometheus-agent
          scope: cluster
          cluster: oje
        annotations:
          title: "[cluster] 클러스터 메트릭 수신 중단"
          summary: "oje 클러스터의 Prometheus remote_write 메트릭이 30분 이상 수신되지 않았습니다."
          description: "클러스터 전체 관측 데이터가 mgmt Prometheus로 들어오지 않습니다. oje prometheus-agent, 네트워크, remote_write 설정을 확인하세요."

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true",cluster=~"ggg|khb|ljw|nmg|oje"} == 0
        for: 10m
        labels:
          severity: critical
          team: monitoring
          channel: infra
          service: kubernetes
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] Kubernetes 노드 NotReady"
          summary: "{{ $labels.cluster }} / {{ $labels.node }} 노드가 Ready 상태가 아닙니다."
          description: "Kubernetes 노드가 10분 이상 NotReady입니다. 단기 재부팅/업데이트 흔들림은 제외하고, 노드 전원/네트워크/kubelet 상태와 해당 노드의 Pod 영향을 확인하세요."

      - alert: KubeStateMetricsDown
        expr: up{job="kube-state-metrics",cluster=~"ggg|khb|ljw|nmg|oje"} == 0
        for: 30m
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: kube-state-metrics
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] kube-state-metrics 수집 중단"
          summary: "{{ $labels.cluster }} 클러스터의 kube-state-metrics 수집이 30분 이상 중단되었습니다."
          description: "Kubernetes object 상태 관측 데이터가 장시간 누락되었습니다. 노드/워크로드 장애 알림이 함께 없으면 낮은 우선순위로 kube-state-metrics와 Prometheus agent를 확인하세요."

      - alert: KubeletMetricsDown
        expr: up{job="kubernetes-kubelet",cluster=~"ggg|khb|ljw|nmg|oje"} == 0
        for: 15m
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: kubelet
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] kubelet 수집 중단"
          summary: "{{ $labels.cluster }} / {{ $labels.node }} kubelet 메트릭 수집이 15분 이상 중단되었습니다."
          description: "kubelet 메트릭 누락만으로 즉시 서비스 장애라고 보지 않습니다. 노드 NotReady 또는 Pod 장애와 함께 발생하면 우선 대응하세요."

      - alert: CAdvisorMetricsDown
        expr: up{job="kubernetes-cadvisor",cluster=~"ggg|khb|ljw|nmg|oje"} == 0
        for: 15m
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: cadvisor
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] cAdvisor 수집 중단"
          summary: "{{ $labels.cluster }} / {{ $labels.node }} cAdvisor 메트릭 수집이 15분 이상 중단되었습니다."
          description: "컨테이너 사용량 관측 데이터 누락입니다. 노드 NotReady 또는 Pod 장애와 함께 발생하지 않으면 낮은 우선순위로 확인하세요."

      - alert: OpenCostMetricsDown
        expr: up{job="opencost",cluster=~"ggg|khb|ljw|nmg|oje"} == 0
        for: 30m
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: opencost
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] OpenCost 수집 중단"
          summary: "{{ $labels.cluster }} 클러스터의 OpenCost 수집이 30분 이상 중단되었습니다."
          description: "비용 관측 데이터 누락입니다. 실제 서비스 장애가 아니라면 업무 시간에 OpenCost exporter 또는 remote_write 경로를 확인하세요."

      - alert: KubePodPending
        expr: sum by(cluster, namespace) (kube_pod_status_phase{phase="Pending",namespace!~"kube-system|velero",cluster=~"ggg|khb|ljw|nmg|oje"} == 1) > 2
        for: 20m
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: kubernetes
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] Pending Pod 지속"
          summary: "{{ $labels.cluster }} / {{ $labels.namespace }} 네임스페이스에 Pending Pod가 3개 이상 지속되고 있습니다."
          description: "일시적인 Job/이미지 pull 대기는 제외합니다. 20분 이상 3개 이상 Pending이면 스케줄링 실패, 리소스 부족, PVC 문제, taint/toleration 문제를 확인하세요."

      - alert: KubePodRestartsHigh
        expr: sum by(cluster, namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace!~"kube-system|velero|logging|monitoring",cluster=~"ggg|khb|ljw|nmg|oje"}[30m])) > 10
        for: 15m
        labels:
          severity: warning
          team: monitoring
          channel: infra
          service: kubernetes
          scope: cluster
          cluster: "{{ $labels.cluster }}"
        annotations:
          title: "[cluster] Pod 재시작 증가"
          summary: "{{ $labels.cluster }} / {{ $labels.namespace }}/{{ $labels.pod }} Pod가 반복 재시작 중입니다."
          description: "시스템/관측 네임스페이스와 짧은 재시작은 제외합니다. 최근 30분 동안 10회를 초과하고 15분 이상 지속되면 Pod 이벤트, 로그, readiness/liveness probe, OOM 여부를 확인하세요."
