groups:
  - name: cluster-lifecycle
    interval: 1m
    rules:
      - record: cluster_monitoring_enabled
        expr: |
          label_replace(vector(1), "cluster", "ggg", "__name__", ".*")
          or label_replace(vector(0), "cluster", "nmg", "__name__", ".*")
          or label_replace(vector(0), "cluster", "oje", "__name__", ".*")
          or label_replace(vector(0), "cluster", "khb", "__name__", ".*")
          or label_replace(vector(0), "cluster", "ljw", "__name__", ".*")
  - name: infra-endpoints
    interval: 1m
    rules:
      - alert: InfraEndpointDown
        expr: probe_success{job=~"blackbox-http.*|blackbox-dns",scope="infra"} == 0
        for: 10m
        labels:
          severity: critical
          team: monitoring
          channel: infra
          service: "{{ $labels.service }}"
          scope: infra
          cluster: mgmt
          target: "{{ $labels.target }}"
        annotations:
          title: "[infra] endpoint 응답 실패"
          summary: "{{ $labels.service }} endpoint가 10분 이상 정상 응답하지 않습니다."
          description: "외부 접근 경로 기준의 핵심 관측 endpoint 알림입니다. Traefik 라우팅, TLS/DNS, 대상 컨테이너 상태를 확인하세요."
      - alert: TeamEndpointDown
        expr: (probe_success{job="blackbox-http",scope="team",lifecycle="active"} == 0) and on(cluster) (cluster_monitoring_enabled == 1)
        for: 15m
        labels:
          severity: warning
          team: "{{ $labels.team }}"
          channel: infra
          service: "{{ $labels.service }}"
          scope: team
          cluster: "{{ $labels.cluster }}"
          target: "{{ $labels.target }}"
        annotations:
          title: "[team] endpoint 응답 실패"
          summary: "{{ $labels.service }} endpoint가 15분 이상 정상 응답하지 않습니다."
          description: "mgmt 관점에서 팀 Kubernetes API 또는 사용자 대시보드 경로가 응답하지 않습니다. API와 대시보드 상태를 분리해 확인하세요."
