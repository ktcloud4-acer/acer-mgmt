groups:
  - name: infra-endpoints
    interval: 1m
    rules:
      - alert: InfraEndpointDown
        expr: probe_success{job="blackbox-http",scope="infra"} == 0
        for: 10m
        labels:
          severity: critical
          team: monitoring
          channel: infra
          service: "{{ $labels.service }}"
          scope: infra
          cluster: mgmt
          target: "{{ $labels.target }}"
        annotations:
          title: "[infra] endpoint 응답 실패"
          summary: "{{ $labels.service }} endpoint가 10분 이상 정상 응답하지 않습니다."
          description: "외부 접근 경로 기준의 핵심 관측 endpoint 알림입니다. Traefik 라우팅, TLS/DNS, 대상 컨테이너 상태를 확인하세요."
