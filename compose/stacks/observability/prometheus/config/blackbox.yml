modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      preferred_ip_protocol: ip4
  http_3xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      follow_redirects: false
      valid_status_codes: [301, 302, 303, 307, 308]
      preferred_ip_protocol: ip4
  http_3xx_gitlab:
    prober: http
    timeout: 5s
    http:
      method: GET
      follow_redirects: false
      valid_status_codes: [301, 302, 303, 307, 308]
      headers:
        Host: gitlab.imcherry5778.xyz
      tls_config:
        server_name: gitlab.imcherry5778.xyz
      preferred_ip_protocol: ip4
  http_401:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [401]
      preferred_ip_protocol: ip4
  http_403:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [403]
      preferred_ip_protocol: ip4
  dns_adguard:
    prober: dns
    timeout: 5s
    dns:
      query_name: grafana.imcherry5778.xyz
      query_type: A
      transport_protocol: tcp
      preferred_ip_protocol: ip4
