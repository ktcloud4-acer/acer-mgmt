# Alertmanager — Prometheus alert router and silence UI.

services:
  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    restart: unless-stopped
    user: "100:1000"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.${BASE_DOMAIN}
      - --web.route-prefix=/
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/alertmanager:/alertmanager:Z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-agent/secrets/alertmanager:/etc/alertmanager/secrets:ro,z
    networks:
      - mgmt-proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.${BASE_DOMAIN}`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.middlewares=sso-auth@file,secure-headers@file"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
