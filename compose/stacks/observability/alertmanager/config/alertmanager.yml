global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_infra

route:
  receiver: slack-infra-alerts
  group_by:
    - alertname
    - severity
    - scope
    - cluster
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: "null"
      matchers:
        - severity="test"
    - receiver: slack-argocd-alerts
      matchers:
        - channel="argocd"
      repeat_interval: 4h
    - receiver: slack-infra-alerts
      matchers:
        - severity="critical"
      repeat_interval: 4h
    - receiver: slack-infra-alerts
      matchers:
        - severity="warning"
      repeat_interval: 12h

receivers:
  - name: "null"

  - name: slack-infra-alerts
    slack_configs:
      - send_resolved: true
        title: '{{ if eq .Status "firing" }}[긴급]{{ else }}[복구]{{ end }} {{ if .CommonAnnotations.title }}{{ .CommonAnnotations.title }}{{ else }}{{ .CommonLabels.alertname }}{{ end }}'
        text: |-
          {{ range .Alerts }}
          상태: {{ .Status }}
          심각도: {{ .Labels.severity }}
          범위: {{ if .Labels.scope }}{{ .Labels.scope }}{{ else }}-{{ end }}
          클러스터: {{ if .Labels.cluster }}{{ .Labels.cluster }}{{ else }}-{{ end }}
          서비스: {{ if .Labels.service }}{{ .Labels.service }}{{ else }}-{{ end }}
          대상: {{ if .Labels.target }}{{ .Labels.target }}{{ else if .Labels.instance }}{{ .Labels.instance }}{{ else if .Labels.node }}{{ .Labels.node }}{{ else if .Labels.pod }}{{ .Labels.namespace }}/{{ .Labels.pod }}{{ else }}-{{ end }}
          요약: {{ .Annotations.summary }}
          설명: {{ .Annotations.description }}
          {{ end }}

  - name: slack-argocd-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_argocd
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[긴급]{{ else }}[복구]{{ end }} {{ if .CommonAnnotations.title }}{{ .CommonAnnotations.title }}{{ else }}{{ .CommonLabels.alertname }}{{ end }}'
        text: |-
          {{ range .Alerts }}
          상태: {{ .Status }}
          심각도: {{ .Labels.severity }}
          범위: {{ if .Labels.scope }}{{ .Labels.scope }}{{ else }}-{{ end }}
          클러스터: {{ if .Labels.cluster }}{{ .Labels.cluster }}{{ else }}-{{ end }}
          서비스: {{ if .Labels.service }}{{ .Labels.service }}{{ else }}-{{ end }}
          대상: {{ if .Labels.target }}{{ .Labels.target }}{{ else if .Labels.instance }}{{ .Labels.instance }}{{ else if .Labels.node }}{{ .Labels.node }}{{ else if .Labels.pod }}{{ .Labels.namespace }}/{{ .Labels.pod }}{{ else }}-{{ end }}
          요약: {{ .Annotations.summary }}
          설명: {{ .Annotations.description }}
          {{ end }}
