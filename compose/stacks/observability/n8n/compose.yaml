# n8n — Prometheus 기반 전 팀 운영 다이제스트.
#
# 시작 전 Vault Agent가 observability/n8n.env를 렌더해야 한다.
# 실행 예:
#   cd compose
#   docker compose --env-file ../.env \
#     --env-file /home/mgmt-data/vault-agent/secrets/observability/n8n.env \
#     -f stacks/observability/n8n/compose.yaml up -d

services:
  n8n-db:
    image: postgres:17-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?DB_POSTGRESDB_PASSWORD must be set}
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/n8n/postgres:/var/lib/postgresql/data:Z
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  n8n-slack-relay:
    image: nginx:1.27-alpine
    container_name: n8n-slack-relay
    restart: unless-stopped
    environment:
      SLACK_WEBHOOK_INFRA: ${SLACK_WEBHOOK_INFRA:?SLACK_WEBHOOK_INFRA must be set}
    volumes:
      - ./config/default.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
    networks:
      - n8n-internal
      - mgmt-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.26.8
    container_name: n8n
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      n8n-db:
        condition: service_healthy
      n8n-slack-relay:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?DB_POSTGRESDB_PASSWORD must be set}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_HOST: n8n.${BASE_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${BASE_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n.${BASE_DOMAIN}/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "500"
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/n8n/app:/home/node/.n8n:Z
      - ./workflows:/workflows:ro,Z
    networks:
      - n8n-internal
      - mgmt-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${BASE_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.middlewares=secure-headers@file,sso-auth@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

networks:
  n8n-internal:
    internal: true
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
