# Tempo monolithic(single-binary) 설정.
# 시작은 local 디스크 백엔드로 단순하게. 규모가 커지면 storage.trace.backend 를
# estate 에 이미 있는 S3(MinIO/rustfs)로 교체(하단 주석 참고).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # 트레이스 보존 14d — ELK 로그 보존(14d)과 정렬. 필요 시 조정.
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    # --- S3(MinIO/rustfs)로 전환 시 위 backend/local 을 아래로 교체 ---
    # backend: s3
    # s3:
    #   endpoint: <minio-host>:9000
    #   bucket: tempo
    #   access_key: ${TEMPO_S3_ACCESS_KEY}
    #   secret_key: ${TEMPO_S3_SECRET_KEY}
    #   insecure: true

# --- (옵션) metrics-generator: span 에서 RED 메트릭 + service graph 생성해
#     mgmt Prometheus(remote-write-receiver 이미 활성)로 전송. 처음엔 꺼두고 나중에 opt-in.
# metrics_generator:
#   storage:
#     path: /var/tempo/generator/wal
#     remote_write:
#       - url: http://prometheus:9090/api/v1/write
#         send_exemplars: true
# overrides:
#   defaults:
#     metrics_generator:
#       processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
