# Grafana — Prometheus datasource는 provisioning으로 자동 등록

services:
  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GF_SERVER_DOMAIN: grafana.${BASE_DOMAIN}
      GF_SERVER_ROOT_URL: https://grafana.${BASE_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      # DEMO MODE: Dashy opens Grafana in an iframe for modal/Workspace views.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # oauth2-proxy owns the browser login. Grafana trusts its identity
      # header only when the request originated on the Traefik Docker network.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Auth-Request-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "true"
      # The public OAuth2-Proxy path arrives from Traefik (.2); Teleport
      # identity headers arrive only through the dedicated bridge (.5).
      GF_AUTH_PROXY_WHITELIST: ${TRAEFIK_GRAFANA_AUTH_IP:-10.254.254.2}/32,${GRAFANA_TELEPORT_PROXY_IP:-10.254.254.5}/32
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      SLACK_WEBHOOK_INFRA: ${SLACK_WEBHOOK_INFRA:?SLACK_WEBHOOK_INFRA must be set}
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/grafana:/var/lib/grafana:Z
      - ./provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro,Z
      - ./provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro,Z
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro,Z
      - ./dashboards:/var/lib/grafana/dashboards:ro,Z
    networks:
      - traefik-grafana-auth
      - grafana-observability
      - elk_default
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_GRAFANA_AUTH_NET:-traefik-grafana-auth}"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${BASE_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.middlewares=sso-auth@file,secure-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Adapts Teleport's protected X-Teleport-User header to Grafana's existing
  # trusted auth-proxy header. It is not on mgmt-proxy or any host port.
  grafana-teleport-proxy:
    image: nginx:1.27-alpine
    container_name: grafana-teleport-proxy
    restart: unless-stopped
    volumes:
      - ./teleport-proxy/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    networks:
      traefik-grafana-auth:
        ipv4_address: ${GRAFANA_TELEPORT_PROXY_IP:-10.254.254.5}

networks:
  traefik-grafana-auth:
    name: ${TRAEFIK_GRAFANA_AUTH_NET:-traefik-grafana-auth}
    external: true
  grafana-observability:
    name: ${GRAFANA_OBSERVABILITY_NET:-grafana-observability}
    external: true
  elk_default:
    name: elk_default
    external: true
