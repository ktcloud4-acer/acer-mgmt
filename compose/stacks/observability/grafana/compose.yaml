# Grafana — Prometheus datasource는 provisioning으로 자동 등록

services:
  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    restart: unless-stopped
    # Vault Agent renders secrets as UID 100 / GID 1000 with mode 0640.
    # Keep Grafana's non-root UID and join only that mounted-secret group.
    user: "472:1000"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GF_SERVER_DOMAIN: grafana.${BASE_DOMAIN}
      GF_SERVER_ROOT_URL: https://grafana.${BASE_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      # DEMO MODE: Dashy opens Grafana in an iframe for modal/Workspace views.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: $$__file{/run/secrets/grafana_oidc_client_secret}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.${BASE_DOMAIN}/realms/${KEYCLOAK_REALM:-mgmt}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.${BASE_DOMAIN}/realms/${KEYCLOAK_REALM:-mgmt}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.${BASE_DOMAIN}/realms/${KEYCLOAK_REALM:-mgmt}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_JWK_SET_URL: https://keycloak.${BASE_DOMAIN}/realms/${KEYCLOAK_REALM:-mgmt}/protocol/openid-connect/certs
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_PROXY_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      SLACK_WEBHOOK_INFRA: ${SLACK_WEBHOOK_INFRA:?SLACK_WEBHOOK_INFRA must be set}
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/grafana:/var/lib/grafana:Z
      - ./provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro,Z
      - ./provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro,Z
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro,Z
      - ./dashboards:/var/lib/grafana/dashboards:ro,Z
      - ${DATA_ROOT:-/home/mgmt-data}/vault-agent/secrets/grafana_oidc_client_secret:/run/secrets/grafana_oidc_client_secret:ro,z
    networks:
      - traefik-grafana-auth
      - grafana-observability
      - elk_default
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_GRAFANA_AUTH_NET:-traefik-grafana-auth}"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${BASE_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.middlewares=secure-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  traefik-grafana-auth:
    name: ${TRAEFIK_GRAFANA_AUTH_NET:-traefik-grafana-auth}
    external: true
  grafana-observability:
    name: ${GRAFANA_OBSERVABILITY_NET:-grafana-observability}
    external: true
  elk_default:
    name: elk_default
    external: true
