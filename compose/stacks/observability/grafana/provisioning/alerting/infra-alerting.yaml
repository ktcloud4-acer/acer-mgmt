apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-infra-alerts
    receivers:
      - uid: slack_infra_alerts
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_INFRA}
          title: '{{ if eq .Status "firing" }}[긴급]{{ else }}[복구]{{ end }} {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            상태: {{ .Status }}
            심각도: {{ .Labels.severity }}
            범위: {{ .Labels.scope }}
            클러스터: {{ if .Labels.cluster }}{{ .Labels.cluster }}{{ else }}-{{ end }}
            대상: {{ if .Labels.instance }}{{ .Labels.instance }}{{ else if .Labels.node }}{{ .Labels.node }}{{ else if .Labels.pod }}{{ .Labels.namespace }}/{{ .Labels.pod }}{{ else }}-{{ end }}
            요약: {{ .Annotations.summary }}
            설명: {{ .Annotations.description }}
            {{ end }}
        disableResolveMessage: false

groups:
  - orgId: 1
    name: infra-availability
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra_mgmt_node_down
        title: "[mgmt] node-exporter 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - max(up{job="mgmt-node",instance="node-exporter:9100"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "mgmt 서버의 노드 상태 메트릭이 10분 이상 끊겼습니다."
          description: "일시적인 scrape 누락은 알림하지 않습니다. 10분 이상 mgmt node-exporter가 보이지 않으면 Prometheus/Grafana/GitLab 등 중앙 운영면 장애 가능성이 있으니 node-exporter, Docker, 호스트 네트워크를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: mgmt
          cluster: mgmt
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_aio_node_down
        title: "[aio] node-exporter 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - max(up{job="host-vm",instance="172.16.8.10:9100"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "AIO VM의 노드 상태 메트릭이 10분 이상 끊겼습니다."
          description: "일시적인 scrape 누락은 알림하지 않습니다. 10분 이상 AIO node-exporter가 보이지 않으면 OpenStack/Kubernetes 랩 전체 상태 확인이 필요합니다."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_aio_opencost_down
        title: "[aio] OpenCost 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - max(up{job="aio-opencost",cluster="aio"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 30m
        annotations:
          summary: "AIO OpenCost 비용 메트릭 수집이 30분 이상 중단되었습니다."
          description: "비용 대시보드 품질 저하 알림입니다. 서비스 장애 알림보다 낮은 우선순위로 OpenCost endpoint와 Prometheus target 상태를 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h

      - uid: infra_opencost_down
        title: "[cluster] OpenCost 수집 중단"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="opencost",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 30m
        annotations:
          summary: "{{ $labels.cluster }} 클러스터의 OpenCost 수집이 30분 이상 중단되었습니다."
          description: "비용 관측 데이터 누락입니다. 실제 서비스 장애가 아니라면 업무 시간에 OpenCost exporter 또는 remote_write 경로를 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h

      - uid: infra_ksm_down
        title: "[cluster] kube-state-metrics 수집 중단"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="kube-state-metrics",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 30m
        annotations:
          summary: "{{ $labels.cluster }} 클러스터의 kube-state-metrics 수집이 30분 이상 중단되었습니다."
          description: "Kubernetes object 상태 관측 데이터가 장시간 누락되었습니다. 노드/워크로드 장애 알림이 함께 없으면 낮은 우선순위로 kube-state-metrics와 Prometheus agent를 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h

      - uid: infra_kubelet_down
        title: "[cluster] kubelet 수집 중단"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="kubernetes-kubelet",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 15m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.node }} kubelet 메트릭 수집이 15분 이상 중단되었습니다."
          description: "kubelet 메트릭 누락만으로 즉시 서비스 장애라고 보지 않습니다. 노드 NotReady 또는 Pod 장애와 함께 발생하면 우선 대응하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h

      - uid: infra_cadvisor_down
        title: "[cluster] cAdvisor 수집 중단"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="kubernetes-cadvisor",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 15m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.node }} cAdvisor 메트릭 수집이 15분 이상 중단되었습니다."
          description: "컨테이너 사용량 관측 데이터 누락입니다. 노드 NotReady 또는 Pod 장애와 함께 발생하지 않으면 낮은 우선순위로 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h

  - orgId: 1
    name: infra-node-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra_k8s_node_not_ready
        title: "[cluster] Kubernetes 노드 NotReady"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: kube_node_status_condition{condition="Ready",status="true",cluster=~"ggg|khb|ljw|nmg|oje"} == bool 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.node }} 노드가 Ready 상태가 아닙니다."
          description: "Kubernetes 노드가 10분 이상 NotReady입니다. 단기 재부팅/업데이트 흔들림은 제외하고, 노드 전원/네트워크/kubelet 상태와 해당 노드의 Pod 영향을 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_mgmt_disk_high
        title: "[mgmt] 루트 디스크 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{job="mgmt-node",instance="node-exporter:9100",mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{job="mgmt-node",instance="node-exporter:9100",mountpoint="/",fstype!="rootfs"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [95], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 20m
        annotations:
          summary: "mgmt 서버 루트 디스크 사용률이 95%를 20분 이상 넘었습니다."
          description: "실제 장애 위험 기준입니다. Docker 볼륨, 로그, 백업 데이터 사용량을 확인하세요. 디스크가 가득 차면 Grafana/Prometheus/GitLab 등 mgmt 서비스에 영향이 생길 수 있습니다."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: mgmt
          cluster: mgmt
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_aio_disk_high
        title: "[aio] 루트 디스크 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: max(100 - ((node_filesystem_avail_bytes{job="host-vm",instance="172.16.8.10:9100",mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{job="host-vm",instance="172.16.8.10:9100",mountpoint="/",fstype!="rootfs"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [95], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 20m
        annotations:
          summary: "AIO VM 루트 디스크 사용률이 95%를 20분 이상 넘었습니다."
          description: "실제 장애 위험 기준입니다. AIO VM의 Docker/Kubernetes 데이터, 이미지, 로그 사용량을 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_mgmt_mem_high
        title: "[mgmt] 메모리 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes{job="mgmt-node",instance="node-exporter:9100"} / node_memory_MemTotal_bytes{job="mgmt-node",instance="node-exporter:9100"})) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [95], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 30m
        annotations:
          summary: "mgmt 서버 메모리 사용률이 95%를 30분 이상 넘었습니다."
          description: "짧은 캐시/배치 스파이크는 알림하지 않습니다. 30분 이상 메모리 여유가 부족하면 Prometheus, Grafana, GitLab, Harbor 등 주요 컨테이너의 메모리 사용량을 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: mgmt
          cluster: mgmt
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 12h

      - uid: infra_aio_mem_high
        title: "[aio] 메모리 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: max((1 - (node_memory_MemAvailable_bytes{job="host-vm",instance="172.16.8.10:9100"} / node_memory_MemTotal_bytes{job="host-vm",instance="172.16.8.10:9100"})) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [95], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 30m
        annotations:
          summary: "AIO VM 메모리 사용률이 95%를 30분 이상 넘었습니다."
          description: "짧은 캐시/배치 스파이크는 알림하지 않습니다. 30분 이상 메모리 여유가 부족하면 AIO VM의 OpenStack/Kubernetes/Docker 워크로드를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 12h

  - orgId: 1
    name: infra-workload-cost
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra_pod_pending
        title: "[cluster] Pending Pod 지속"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum by(cluster, namespace) (kube_pod_status_phase{phase="Pending",namespace!~"kube-system|velero",cluster=~"ggg|khb|ljw|nmg|oje"} == 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [2], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 20m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.namespace }} 네임스페이스에 Pending Pod가 3개 이상 지속되고 있습니다."
          description: "일시적인 Job/이미지 pull 대기는 제외합니다. 20분 이상 3개 이상 Pending이면 스케줄링 실패, 리소스 부족, PVC 문제, taint/toleration 문제를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 12h

      - uid: infra_pod_restarts
        title: "[cluster] Pod 재시작 증가"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum by(cluster, namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace!~"kube-system|velero|logging|monitoring",cluster=~"ggg|khb|ljw|nmg|oje"}[30m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [10], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 15m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.namespace }}/{{ $labels.pod }} Pod가 반복 재시작 중입니다."
          description: "시스템/관측 네임스페이스와 짧은 재시작은 제외합니다. 최근 30분 동안 10회를 초과하고 15분 이상 지속되면 Pod 이벤트, 로그, readiness/liveness probe, OOM 여부를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 12h

      - uid: infra_opencost_node_cost_missing
        title: "[cluster] OpenCost 노드 비용 메트릭 부족"
        isPaused: true
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 3 - count by(cluster) (node_total_hourly_cost{cluster=~"ggg|khb|ljw|nmg|oje"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 60m
        annotations:
          summary: "{{ $labels.cluster }} 클러스터의 OpenCost 노드 비용 메트릭 수가 부족합니다."
          description: "비용 관측 품질 알림입니다. 실제 서비스 장애와 분리해 업무 시간에 OpenCost, kube-state-metrics, kubelet/cAdvisor 수집 상태를 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: opencost
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 24h
