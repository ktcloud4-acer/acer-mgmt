        for: 5m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.node }} cAdvisor 메트릭 수집이 중단되었습니다."
          description: "컨테이너 사용량 메트릭이 끊겼습니다. kubelet /metrics/cadvisor 경로와 Prometheus agent scrape 상태를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

  - orgId: 1
    name: infra-node-health
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra_k8s_node_not_ready
        title: "[cluster] Kubernetes 노드 NotReady"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: kube_node_status_condition{condition="Ready",status="true",cluster=~"ggg|khb|ljw|nmg|oje"} == bool 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 5m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.node }} 노드가 Ready 상태가 아닙니다."
          description: "Kubernetes 노드 상태가 NotReady입니다. 노드 전원/네트워크/kubelet 상태와 해당 노드의 Pod 영향을 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_mgmt_disk_high
        title: "[mgmt] 루트 디스크 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{job="mgmt-node",instance="node-exporter:9100",mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{job="mgmt-node",instance="node-exporter:9100",mountpoint="/",fstype!="rootfs"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "mgmt 서버 루트 디스크 사용률이 90%를 넘었습니다."
          description: "Docker 볼륨, 로그, 백업 데이터 사용량을 확인하세요. 디스크가 가득 차면 Grafana/Prometheus/GitLab 등 mgmt 서비스에 영향이 생길 수 있습니다."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: mgmt
          cluster: mgmt
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_aio_disk_high
        title: "[aio] 루트 디스크 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: max(100 - ((node_filesystem_avail_bytes{job="host-vm",instance="172.16.8.10:9100",mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{job="host-vm",instance="172.16.8.10:9100",mountpoint="/",fstype!="rootfs"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "AIO VM 루트 디스크 사용률이 90%를 넘었습니다."
          description: "AIO VM의 Docker/Kubernetes 데이터, 이미지, 로그 사용량을 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_mgmt_mem_high
        title: "[mgmt] 메모리 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes{job="mgmt-node",instance="node-exporter:9100"} / node_memory_MemTotal_bytes{job="mgmt-node",instance="node-exporter:9100"})) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 15m
        annotations:
          summary: "mgmt 서버 메모리 사용률이 90%를 넘었습니다."
          description: "Prometheus, Grafana, GitLab, Harbor 등 주요 컨테이너의 메모리 사용량을 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: mgmt
          cluster: mgmt
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 6h

      - uid: infra_aio_mem_high
        title: "[aio] 메모리 사용률 높음"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: max((1 - (node_memory_MemAvailable_bytes{job="host-vm",instance="172.16.8.10:9100"} / node_memory_MemTotal_bytes{job="host-vm",instance="172.16.8.10:9100"})) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 15m
        annotations:
          summary: "AIO VM 메모리 사용률이 90%를 넘었습니다."
          description: "AIO VM의 Kubernetes/Docker 워크로드와 시스템 메모리 사용량을 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 6h

  - orgId: 1
    name: infra-workload-cost
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra_pod_pending
        title: "[cluster] Pending Pod 지속"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum by(cluster, namespace) (kube_pod_status_phase{phase="Pending",cluster=~"ggg|khb|ljw|nmg|oje"} == 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.namespace }} 네임스페이스에 Pending Pod가 지속되고 있습니다."
          description: "스케줄링 실패, 리소스 부족, PVC 문제, taint/toleration 문제를 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 6h

      - uid: infra_pod_restarts
        title: "[cluster] Pod 재시작 증가"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: sum by(cluster, namespace, pod) (increase(kube_pod_container_status_restarts_total{cluster=~"ggg|khb|ljw|nmg|oje"}[10m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [3], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 10m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.namespace }}/{{ $labels.pod }} Pod 재시작이 증가했습니다."
          description: "최근 10분 동안 Pod 재시작이 3회를 초과했습니다. Pod 이벤트, 로그, readiness/liveness probe, OOM 여부를 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 6h

      - uid: infra_opencost_node_cost_missing
        title: "[cluster] OpenCost 노드 비용 메트릭 부족"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 3 - count by(cluster) (node_total_hourly_cost{cluster=~"ggg|khb|ljw|nmg|oje"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        executionErrorState: Error
        for: 20m
        annotations:
          summary: "{{ $labels.cluster }} 클러스터의 OpenCost 노드 비용 메트릭 수가 부족합니다."
          description: "master/worker1/worker2 기준 node_total_hourly_cost가 3개보다 적습니다. OpenCost, kube-state-metrics, kubelet/cAdvisor 수집 상태를 함께 확인하세요."
        labels:
          severity: warning
          team: monitoring
          channel: infra
          scope: opencost
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 6h
