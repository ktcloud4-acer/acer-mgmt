          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_cadvisor_down
        title: "[cluster] cAdvisor 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="kubernetes-cadvisor",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
