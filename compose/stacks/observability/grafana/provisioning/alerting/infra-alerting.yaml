apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-infra-alerts
    receivers:
      - uid: slack_infra_alerts
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_INFRA}
          title: '{{ if eq .Status "firing" }}[발생]{{ else }}[복구]{{ end }} {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            상태: {{ .Status }}
            심각도: {{ .Labels.severity }}
            범위: {{ .Labels.scope }}
            클러스터: {{ if .Labels.cluster }}{{ .Labels.cluster }}{{ else }}-{{ end }}
            대상: {{ if .Labels.instance }}{{ .Labels.instance }}{{ else if .Labels.node }}{{ .Labels.node }}{{ else if .Labels.pod }}{{ .Labels.namespace }}/{{ .Labels.pod }}{{ else }}-{{ end }}
            요약: {{ .Annotations.summary }}
            설명: {{ .Annotations.description }}
            {{ end }}
        disableResolveMessage: false

groups:
  - orgId: 1
    name: infra-availability
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra_mgmt_node_down
        title: "[mgmt] node-exporter 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - max(up{job="mgmt-node",instance="node-exporter:9100"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 2m
        annotations:
          summary: "mgmt 서버의 node-exporter 메트릭 수집이 중단되었습니다."
          description: "mgmt 서버 자체의 OS/노드 상태 메트릭을 Prometheus가 받지 못하고 있습니다. node-exporter 컨테이너와 Prometheus scrape 상태를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: mgmt
          cluster: mgmt
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_aio_node_down
        title: "[aio] node-exporter 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - max(up{job="host-vm",instance="172.16.8.10:9100"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 2m
        annotations:
          summary: "AIO VM의 node-exporter 메트릭 수집이 중단되었습니다."
          description: "AIO VM(172.16.8.10)의 OS/노드 상태 메트릭을 Prometheus가 받지 못하고 있습니다. AIO node-exporter와 네트워크 경로를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_aio_opencost_down
        title: "[aio] OpenCost 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - max(up{job="aio-opencost",cluster="aio"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 5m
        annotations:
          summary: "AIO OpenCost exporter 수집이 중단되었습니다."
          description: "AIO OpenCost :9003/metrics scrape가 실패하고 있습니다. OpenCost endpoint와 Prometheus target 상태를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: aio
          cluster: aio
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_opencost_down
        title: "[cluster] OpenCost 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="opencost",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 5m
        annotations:
          summary: "{{ $labels.cluster }} 클러스터의 OpenCost 수집이 중단되었습니다."
          description: "해당 클러스터의 OpenCost exporter 또는 Prometheus remote_write 경로를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_ksm_down
        title: "[cluster] kube-state-metrics 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="kube-state-metrics",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 5m
        annotations:
          summary: "{{ $labels.cluster }} 클러스터의 kube-state-metrics 수집이 중단되었습니다."
          description: "Kubernetes object 상태 메트릭이 끊겼습니다. kube-state-metrics Deployment/Service와 Prometheus scrape 상태를 확인하세요."
        labels:
          severity: critical
          team: monitoring
          channel: infra
          scope: cluster
        notification_settings:
          receiver: slack-infra-alerts
          group_by: [alertname, grafana_folder, severity, scope, cluster]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: infra_kubelet_down
        title: "[cluster] kubelet 수집 중단"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 1 - up{job="kubernetes-kubelet",cluster=~"ggg|khb|ljw|nmg|oje"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 5m
        annotations:
          summary: "{{ $labels.cluster }} / {{ $labels.node }} kubelet 메트릭 수집이 중단되었습니다."
          description: "kubelet /metrics 수집이 실패하고 있습니다. 노드 상태, kubelet, Prometheus agent 권한과 네트워크를 확인하세요."
        labels:
          severity: critical
