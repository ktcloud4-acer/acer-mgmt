# Restic 암호화 백업 — DATA_ROOT를 내부 MinIO의 restic 버킷에 매일 저장
# 실행 중인 DB의 애플리케이션 정합성 백업은 각 DB dump 작업으로 별도 보강해야 한다.

services:
  restic:
    image: restic/restic:0.19.1
    container_name: restic
    restart: unless-stopped
    mem_limit: 1g
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! restic snapshots >/dev/null 2>&1; then
          restic init
        fi
        run_backup() {
          restic backup /source \
            --exclude=/source/minio \
            --exclude=/source/restic-cache \
            --exclude-caches \
            --tag daily
          restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
        }
        write_success_metric() {
          mkdir -p /metrics
          success_at="$$(date +%s)"
          {
            echo "# HELP restic_last_success_timestamp_seconds Last successful restic backup Unix timestamp."
            echo "# TYPE restic_last_success_timestamp_seconds gauge"
            echo "restic_last_success_timestamp_seconds{scope=\"backup\",cluster=\"mgmt\",service=\"restic\"} $${success_at}"
          } > /metrics/restic.prom.tmp
          mv /metrics/restic.prom.tmp /metrics/restic.prom
        }

        while true; do
          now="$$(date +%s)"
          today="$$(date +%F)"
          target="$$(date -d "$${today} $${RESTIC_BACKUP_TIME}" +%s)"
          if [ "$$now" -ge "$$target" ]; then
            target="$$((target + 86400))"
          fi
          sleep_seconds="$$((target - now))"
          echo "next restic backup at $$(date -d "@$${target}" -Is); sleeping $${sleep_seconds}s"
          sleep "$$sleep_seconds"
          run_backup
          write_success_metric
        done
    environment:
      TZ: ${TZ:-Asia/Seoul}
      RESTIC_REPOSITORY: s3:http://minio:9000/restic
      RESTIC_BACKUP_TIME: ${RESTIC_BACKUP_TIME:-16:20:00}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD must be set}
      RESTIC_ACCESS_KEY: ${RESTIC_ACCESS_KEY:?RESTIC_ACCESS_KEY must be set}
      RESTIC_SECRET_KEY: ${RESTIC_SECRET_KEY:?RESTIC_SECRET_KEY must be set}
      RESTIC_CACHE_DIR: /cache
      AWS_ACCESS_KEY_ID: ${RESTIC_ACCESS_KEY:?RESTIC_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_SECRET_KEY:?RESTIC_SECRET_KEY must be set}
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}:/source:ro,z
      - ${DATA_ROOT:-/home/mgmt-data}/restic-cache:/cache:Z
      - ${DATA_ROOT:-/home/mgmt-data}/node-exporter-textfile:/metrics:Z
    networks:
      - mgmt-proxy
    healthcheck:
      test: ["CMD-SHELL", "restic snapshots --latest 1 >/dev/null"]
      interval: 5m
      timeout: 1m
      retries: 3
      start_period: 10m

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
