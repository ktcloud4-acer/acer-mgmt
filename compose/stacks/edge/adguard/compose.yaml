# AdGuard Home — 내부 DNS 리졸버.
#   관리 서비스별 imcherry5778.xyz → 100.117.59.96 (tailnet) rewrite 를 UI 로 관리한다.
#   팀 dashboard 도메인은 Cloudflare/원격 ingress 경로를 유지하므로 와일드카드 rewrite를 쓰지 않는다.
#   Tailscale Split-DNS 로 imcherry5778.xyz 의 nameserver 를 이 리졸버(100.117.59.96)로
#   지정하면 Cloudflare 없이 내부에서 모든 서브도메인이 해석된다.
#   DNS(53)만 tailnet IP 에 바인딩한다. 관리 UI(3000)는 Traefik + oauth2-proxy
#   경로로만 제공해 Dashy Workspace와 같은 브라우저 인증 관문을 사용한다.

services:
  adguard:
    image: adguard/adguardhome:v0.107.77
    container_name: adguard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "100.117.59.96:53:53/udp"       # DNS (tailnet 전용 바인딩)
      - "100.117.59.96:53:53/tcp"
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/adguard/work:/opt/adguardhome/work:Z
      - ${DATA_ROOT:-/home/mgmt-data}/adguard/conf:/opt/adguardhome/conf:Z
    networks:
      - mgmt-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${BASE_DOMAIN}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.middlewares=sso-auth@file,secure-headers@file"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/adguardhome/AdGuardHome --check-config
          -c /opt/adguardhome/conf/AdGuardHome.yaml
          -w /opt/adguardhome/work >/dev/null
          && wget -q --spider http://127.0.0.1:3000/
          && nslookup grafana.${BASE_DOMAIN} 127.0.0.1 >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
