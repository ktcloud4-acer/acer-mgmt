# AdGuard Home — 내부 DNS 리졸버.
#   *.imcherry5778.xyz → 100.117.59.96 (tailnet) 와일드카드 rewrite 를 UI 로 관리한다.
#   Tailscale Split-DNS 로 imcherry5778.xyz 의 nameserver 를 이 리졸버(100.117.59.96)로
#   지정하면 Cloudflare 없이 내부에서 모든 서브도메인이 해석된다.
#   DNS(53)/UI(3000)는 tailnet IP 에만 바인딩(외부 미노출). traefik 라벨은 DNS 활성 후 서브도메인용.

services:
  adguard:
    image: adguard/adguardhome:latest   # TODO: 기동 후 실제 버전으로 핀 고정
    container_name: adguard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "100.117.59.96:53:53/udp"       # DNS (tailnet 전용 바인딩)
      - "100.117.59.96:53:53/tcp"
      - "100.117.59.96:3000:3000/tcp"   # 웹 UI (tailnet 전용)
    volumes:
      - ${DATA_ROOT:-/home/mgmt-data}/adguard/work:/opt/adguardhome/work:Z
      - ${DATA_ROOT:-/home/mgmt-data}/adguard/conf:/opt/adguardhome/conf:Z
    networks:
      - mgmt-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NET:-mgmt-proxy}"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${BASE_DOMAIN}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.middlewares=secure-headers@file"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"

networks:
  mgmt-proxy:
    name: ${PROXY_NET:-mgmt-proxy}
    external: true
