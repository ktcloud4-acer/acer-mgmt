# Traefik — 내부 단일 인그레스 (Tailscale 전용, DNS-01 HTTPS)
# *.imcherry5778.xyz → Cloudflare DNS A → Tailscale IP(100.117.59.96) → 이 호스트 → Traefik.
# Traefik 이 Cloudflare DNS-01 으로 받은 실제 와일드카드 인증서로 HTTPS 종단.
# 다른 서비스는 아래 라벨 패턴 복사(entrypoints=websecure 면 자동 HTTPS).
# 기동: docker compose --env-file ../.env -f stacks/edge/traefik/compose.yaml up -d
#
# 주의: Docker Engine 29.x(min API 1.40)는 traefik docker provider(API 1.24)를 거부.
#       데몬측 DOCKER_MIN_API_VERSION=1.24 drop-in 필요 → docs/runbook.md 참조.

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}   # Cloudflare DNS-01 (Zone:DNS:Edit)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      - ${DATA_ROOT:-/home/mgmt-data}/vault-tls/ca.crt:/etc/traefik/vault-ca/ca.crt:ro,z
      - ${DATA_ROOT:-/home/mgmt-data}/traefik:/acme        # acme.json 영속
    networks:
      - mgmt-proxy
    labels:
      - "traefik.enable=true"
      # ── 다른 서비스에 이 패턴 복사 (Host 규칙만 교체) ──
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=basic-auth@file,secure-headers@file"

networks:
  mgmt-proxy:
    external: true
