# Wazuh Dashboard stays private on mgmt-proxy; Traefik is its only browser entry.
http:
  routers:
    wazuh-dashboard:
      rule: "Host(`wazuh.${BASE_DOMAIN}`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth@file
        - secure-headers@file
      service: wazuh-dashboard

  services:
    wazuh-dashboard:
      loadBalancer:
        passHostHeader: true
        serversTransport: wazuh-dashboard-tls
        servers:
          - url: "https://wazuh-dashboard:5601"

  serversTransports:
    wazuh-dashboard-tls:
      serverName: wazuh.dashboard
      rootCAs:
        - /etc/traefik/wazuh-ca/root-ca.pem
