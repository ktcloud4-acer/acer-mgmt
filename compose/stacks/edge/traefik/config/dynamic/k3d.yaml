# k3d 내부 Ingress 연결. TLS는 이 Docker Traefik에서 종료한다.
http:
  routers:
    k3d-argocd:
      rule: "Host(`argocd.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - dashy-iframe
      # WAF 파일럿: argocd 트래픽을 standalone Coraza(CRS) WAF 경유로 보낸다.
      # coraza-waf → k3d-mgmt-serverlb:80 (DetectionOnly). 다른 라우터는 k3d-ingress 유지.
      service: coraza-waf
    k3d-chaos-dashboard:
      rule: "Host(`chaos.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth
        - secure-headers
      service: k3d-ingress
    nmg-chaos-dashboard:
      rule: "Host(`nmg-chaos.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth
        - secure-headers
      service: nmg-chaos-dashboard
    ggg-chaos-dashboard:
      rule: "Host(`ggg-chaos.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth
        - secure-headers
      service: ggg-chaos-dashboard
    khb-chaos-dashboard:
      rule: "Host(`khb-chaos.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth
        - secure-headers
      service: khb-chaos-dashboard
    ljw-chaos-dashboard:
      rule: "Host(`ljw-chaos.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth
        - secure-headers
      service: ljw-chaos-dashboard
    oje-chaos-dashboard:
      rule: "Host(`oje-chaos.imcherry5778.xyz`)"
      entryPoints:
        - websecure
      middlewares:
        - sso-auth
        - secure-headers
      service: oje-chaos-dashboard

  services:
    k3d-ingress:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://k3d-mgmt-serverlb:80"
    # standalone Coraza(CRS) WAF — argocd 라우터 전용 업스트림. DetectionOnly.
    coraza-waf:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://coraza-waf:8080"
    nmg-chaos-dashboard:
      loadBalancer:
        # 스포크 traefik(nmg-ingress) 경유: 원본 Host(nmg-chaos.imcherry5778.xyz)를 보존해야
        # 스포크 traefik 의 Ingress 규칙이 매칭된다. 그래서 passHostHeader=true.
        passHostHeader: true
        servers:
          - url: "https://nmg-ingress.tailc0244b.ts.net"
    ggg-chaos-dashboard:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "https://ggg-ingress.tailc0244b.ts.net"
    khb-chaos-dashboard:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "https://khb-ingress.tailc0244b.ts.net"
    ljw-chaos-dashboard:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "https://ljw-ingress.tailc0244b.ts.net"
    oje-chaos-dashboard:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "https://oje-ingress.tailc0244b.ts.net"
