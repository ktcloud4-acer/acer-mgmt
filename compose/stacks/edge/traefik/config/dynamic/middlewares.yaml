# Traefik dynamic config — 공용 미들웨어
http:
  middlewares:
    secure-headers:
      headers:
        # DEMO MODE: permit Dashy's modal and Workspace iframe views.
        # Re-enable frameDeny before exposing this environment beyond the demo.
        # Remove backend frame-denial headers as well, without restarting each app.
        customResponseHeaders:
          X-Frame-Options: ""
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    sso-auth:
      chain:
        middlewares:
          - oauth2-signin
          - oauth2-auth

    oauth2-auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/oauth2/auth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Forwarded-User

    oauth2-signin:
      errors:
        status:
          - "401-403"
        service: oauth2-proxy@docker
        query: /oauth2/sign_in?rd={url}
        statusRewrites:
          "401": 302
          "403": 302

    keycloak-headers:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # Canonical browser addresses for privileged tools. Their service backends
    # stay on internal Docker networks; human UI access is recorded by
    # Teleport at the target address. API/DNS endpoints intentionally do not
    # use these middlewares.
    redirect-to-teleport-adguard:
      redirectRegex:
        regex: "^https?://adguard\\.([^/]+)/(.*)$"
        replacement: "https://adguard.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-traefik:
      redirectRegex:
        regex: "^https?://traefik\\.([^/]+)/(.*)$"
        replacement: "https://traefik.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-minio:
      redirectRegex:
        regex: "^https?://minio\\.([^/]+)/(.*)$"
        replacement: "https://minio.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-semaphore:
      redirectRegex:
        regex: "^https?://semaphore\\.([^/]+)/(.*)$"
        replacement: "https://semaphore.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-kibana:
      redirectRegex:
        regex: "^https?://kibana\\.([^/]+)/(.*)$"
        replacement: "https://kibana.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-prometheus:
      redirectRegex:
        regex: "^https?://prometheus\\.([^/]+)/(.*)$"
        replacement: "https://prometheus.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-alertmanager:
      redirectRegex:
        regex: "^https?://alertmanager\\.([^/]+)/(.*)$"
        replacement: "https://alertmanager.teleport.${1}:3080/${2}"
        permanent: true

    redirect-to-teleport-vault:
      redirectRegex:
        regex: "^https?://vault\\.([^/]+)/(.*)$"
        replacement: "https://vault.teleport.${1}:3080/${2}"
        permanent: true

    # 내부 도구 보호용 기본 인증 (사용 시 .env/secrets 의 해시로 교체)
    basic-auth:
      basicAuth:
        users:
          - "admin:$apr1$9k2at2og$Ch6IDREzEbaYgIsWhs2dK1"
