# Traefik dynamic config — 공용 미들웨어
http:
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # 내부 도구 보호용 기본 인증 (사용 시 .env/secrets 의 해시로 교체)
    basic-auth:
      basicAuth:
        users:
          - "admin:$apr1$9k2at2og$Ch6IDREzEbaYgIsWhs2dK1"
