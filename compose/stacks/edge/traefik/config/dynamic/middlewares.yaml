# Traefik dynamic config — 공용 미들웨어
http:
  middlewares:
    secure-headers:
      headers:
        # DEMO MODE: permit Dashy's modal and Workspace iframe views.
        # Re-enable frameDeny before exposing this environment beyond the demo.
        # Remove backend frame-denial headers as well, without restarting each app.
        customResponseHeaders:
          X-Frame-Options: ""
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    sso-auth:
      chain:
        middlewares:
          - oauth2-signin
          - oauth2-auth

    oauth2-auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/oauth2/auth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups
          - X-Forwarded-User
        # Forward a renewed oauth2-proxy session cookie back to the browser.
        # Without this, an active session keeps its stale cookie even though
        # oauth2-proxy refreshed the Keycloak token during forward auth.
        addAuthCookiesToResponse:
          - _oauth2_proxy

    oauth2-signin:
      errors:
        status:
          - "401-403"
        service: oauth2-proxy@docker
        query: /oauth2/sign_in?rd={url}
        statusRewrites:
          "401": 302
          "403": 302

    # Semaphore uses its own Keycloak OIDC session. Only Dashy may frame it;
    # oauth2-auth provides the platform-admin gate without oauth2-signin.
    semaphore-iframe:
      headers:
        customResponseHeaders:
          X-Frame-Options: ""
          Content-Security-Policy: "frame-ancestors https://dash.imcherry5778.xyz; object-src 'none'"
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    keycloak-headers:
      headers:
        # DEMO MODE: an expired oauth2-proxy session must be able to complete
        # its Keycloak login inside Dashy's Workspace iframe.
        customResponseHeaders:
          X-Frame-Options: ""
          Content-Security-Policy: "frame-src 'self'; frame-ancestors https://dash.imcherry5778.xyz; object-src 'none';"
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # 내부 도구 보호용 기본 인증 (사용 시 .env/secrets 의 해시로 교체)
    basic-auth:
      basicAuth:
        users:
          - "admin:$apr1$9k2at2og$Ch6IDREzEbaYgIsWhs2dK1"
