<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acer Project Architecture Slides</title>
  <style>
    :root {
      --bg: #eef2f7;
      --slide: #ffffff;
      --ink: #111827;
      --muted: #5b6677;
      --blue: #5b68e8;
      --navy: #15345a;
      --line: #244b86;
      --soft-line: #cbd6e5;
      --green: #24a06f;
      --orange: #e18a24;
      --red: #d85149;
      --cyan: #168da3;
      --purple: #7c5bd6;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: 1280px;
      max-width: calc(100vw - 32px);
      margin: 0 auto;
      padding: 24px 0 48px;
      display: grid;
      gap: 28px;
    }

    .slide {
      width: 1280px;
      height: 720px;
      background: var(--slide);
      border: 1px solid #d8e0eb;
      box-shadow: 0 16px 40px rgba(20, 36, 64, 0.14);
      position: relative;
      overflow: hidden;
    }

    .tag {
      position: absolute;
      left: 70px;
      top: 60px;
      width: 246px;
      height: 42px;
      border-radius: 24px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 500;
    }

    .title {
      position: absolute;
      left: 72px;
      top: 132px;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .note {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 44px;
      min-height: 46px;
      padding: 12px 18px;
      border-left: 5px solid var(--blue);
      background: #eef4ff;
      border-radius: 10px;
      color: #263b5c;
      font-size: 16px;
      font-weight: 700;
    }

    .page {
      position: absolute;
      right: 28px;
      bottom: 20px;
      color: #9ca3af;
      font-size: 14px;
    }

    svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1280px;
      height: 720px;
    }

    .box {
      fill: #fff;
      stroke: var(--line);
      stroke-width: 1.4;
    }

    .box-soft {
      fill: #f8fbff;
      stroke: #b9c8dc;
      stroke-width: 1.2;
    }

    .box-green { fill: #effaf5; stroke: #88cfb3; stroke-width: 1.2; }
    .box-blue { fill: #eef4ff; stroke: #9bb7f1; stroke-width: 1.2; }
    .box-orange { fill: #fff5e9; stroke: #ecc38e; stroke-width: 1.2; }
    .box-red { fill: #fff1f0; stroke: #ecaaa6; stroke-width: 1.2; }
    .box-cyan { fill: #eefbfc; stroke: #92d3dc; stroke-width: 1.2; }
    .box-purple { fill: #f4f0ff; stroke: #bfaef0; stroke-width: 1.2; }

    .label {
      font-size: 15px;
      fill: var(--ink);
      font-weight: 700;
    }

    .label-sm {
      font-size: 12px;
      fill: var(--muted);
      font-weight: 600;
    }

    .label-md {
      font-size: 13px;
      fill: var(--ink);
      font-weight: 700;
    }

    .zone-title {
      font-size: 20px;
      font-weight: 800;
      fill: var(--blue);
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      fill: var(--navy);
    }

    .icon {
      fill: var(--blue);
      stroke: none;
    }

    .icon-green { fill: var(--green); }
    .icon-orange { fill: var(--orange); }
    .icon-red { fill: var(--red); }
    .icon-cyan { fill: var(--cyan); }
    .icon-purple { fill: var(--purple); }
    .icon-navy { fill: var(--navy); }

    .arrow {
      stroke: #667085;
      stroke-width: 1.8;
      fill: none;
      marker-end: url(#arrow);
    }

    .arrow-blue {
      stroke: var(--blue);
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowBlue);
    }

    .dash {
      stroke-dasharray: 7 5;
    }

    .pill-text {
      fill: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    @media print {
      body { background: #fff; }
      main { padding: 0; gap: 0; }
      .slide { box-shadow: none; break-after: page; }
    }
  </style>
</head>
