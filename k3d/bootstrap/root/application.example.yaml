apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acer-applications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ktcloud4-acer/acer-argocd.git
    targetRevision: main
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
