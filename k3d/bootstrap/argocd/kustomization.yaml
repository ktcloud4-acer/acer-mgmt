apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.4/manifests/install.yaml
  - ingress.yaml

configMapGenerator:
  - name: argocd-notifications-cm
    behavior: replace
    files:
      - context=notifications/context.yaml
      - service.webhook.argocd_slack=notifications/service.webhook.argocd_slack.yaml
      - template.app-failure=notifications/template.app-failure.yaml
      - trigger.on-failure=notifications/trigger.on-failure.yaml

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: server-insecure-patch.yaml
  - path: cmd-params-cm-patch.yaml
  - path: notifications-secret-delete-patch.yaml
