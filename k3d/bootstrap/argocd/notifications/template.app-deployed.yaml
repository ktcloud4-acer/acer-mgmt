message: |
  [ArgoCD 알림] 배포 완료 또는 복구
  앱: {{.app.metadata.name}}
  프로젝트: {{.app.spec.project}}
  대상: {{.app.spec.destination.server}} / {{.app.spec.destination.namespace}}
  상태: Health={{.app.status.health.status}}, Sync={{.app.status.sync.status}}
  리비전: {{.app.status.sync.revision}}
  저장소: {{.app.spec.source.repoURL}}
  바로가기: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
webhook:
  argocd_slack:
    method: POST
    body: |
      {
        "text": "[ArgoCD 알림] 배포 완료 또는 복구\n앱: {{.app.metadata.name}}\n프로젝트: {{.app.spec.project}}\n대상: {{.app.spec.destination.server}} / {{.app.spec.destination.namespace}}\n상태: Health={{.app.status.health.status}}, Sync={{.app.status.sync.status}}\n리비전: {{.app.status.sync.revision}}\n저장소: {{.app.spec.source.repoURL}}\n바로가기: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
      }
